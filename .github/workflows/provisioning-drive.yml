name: Provisioning worker

# Multi-stage driver for the tenant provisioning state machine.
#
#   preflight --+--> sweep    (schedule only - drift reconciliation)
#               +--> drive --> verify
#                                |
#                            report (always)
#
# WHY THIS SHAPE
# --------------
# Provisioning is OPERATOR-GATED: the only route that enqueues a job is
# POST /api/admin/ecom/customers/[id]/provision (super_admin only). There is no
# self-serve provisioning path, so a human is already present when a job starts -
# a manual workflow_dispatch is a legitimate driver, and avoids 1440 scheduled
# runs/day for something that happens a few times a month.
#
# Deprovision needs NOTHING here: the Razorpay webhook and the admin button both
# call deprovisionTenant() inline.
#
# The ONLY thing that genuinely needs a schedule is reconcileOrphanedTenants() -
# the drift sweep. A tenant left status='active' with no rds_endpoint would fall
# back to the MAIN database (the isolation bug fixed in 28c3729d), and drift is by
# definition unpredictable. It runs on every tick of this endpoint, so the hourly
# schedule below covers it. Drift detection does not need 60-second resolution.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
# Acceptable for an hourly *sweep*; NOT acceptable if this were the primary
# provisioning driver. If the repo goes quiet, re-enable it in the Actions tab,
# or move the sweep to an EC2 crontab (see deploy/sync-cron-setup.sh).
#
# REQUIRED CONFIG
#   secrets.CRON_SECRET   must match CRON_SECRET in the app's .env.production
#   vars.APP_URL          optional, defaults to https://jeffistores.in

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Max minutes to keep driving (RDS create alone takes ~10)'
        required: false
        default: '25'
      dry_run:
        description: 'Preflight only - validate config, advance nothing'
        type: boolean
        required: false
        default: false
      reason:
        description: 'Why you are running this (for the audit trail)'
        required: false
        default: 'manual provisioning drive'
  schedule:
    # Hourly at :17 - deliberately off the hour, where GitHub's scheduler is most
    # congested and most likely to delay or drop a run.
    - cron: '17 * * * *'

# FAILSAFE: never let two drivers advance the same job concurrently. Steps are
# idempotent, but overlapping runs waste ticks against the engine's 8-attempt cap
# and interleave logs. Queue rather than cancel - cancelling mid-drive would
# strand a job (harmless, but it would need another run to finish).
concurrency:
  group: provisioning-worker
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_URL: ${{ vars.APP_URL || 'https://jeffistores.in' }}

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 - preflight. No side effects. Proves we CAN drive before we try.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask secret
        run: echo "::add-mask::${{ secrets.CRON_SECRET }}"

      - name: Validate config, deployment and auth
        id: check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash .github/scripts/provisioning-drive.sh preflight

  # ---------------------------------------------------------------------------
  # STAGE 2a - scheduled drift sweep. Cheap: one tick.
  # ---------------------------------------------------------------------------
  sweep:
    name: Drift sweep
    needs: preflight
    if: github.event_name == 'schedule' && needs.preflight.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo "::add-mask::${{ secrets.CRON_SECRET }}"
      - name: Reconcile orphaned tenants
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash .github/scripts/provisioning-drive.sh sweep

  # ---------------------------------------------------------------------------
  # STAGE 2b - manual drive. Loops until every job is terminal.
  # ---------------------------------------------------------------------------
  drive:
    name: Drive provisioning
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.preflight.outputs.ok == 'true' &&
      inputs.dry_run != true
    runs-on: ubuntu-latest
    # Hard ceiling above the script's own deadline so a hung runner cannot bill forever.
    timeout-minutes: 130
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      ticks: ${{ steps.run.outputs.ticks }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "::add-mask::${{ secrets.CRON_SECRET }}"

      - name: Announce
        run: |
          echo "Reason:  ${{ inputs.reason }}"
          echo "Actor:   ${{ github.actor }}"
          echo "Budget:  ${{ inputs.max_minutes }} min"

      - name: Drive jobs to completion
        id: run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          LOG_FILE: ${{ runner.temp }}/provisioning-drive.log
        # exit 2 == deadline reached with work still in flight. That is NOT a
        # failure - re-running resumes from the current step. Surfaced as a
        # warning in the report stage instead of failing the run.
        run: |
          set +e
          bash .github/scripts/provisioning-drive.sh drive
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"

      # FAILSAFE: keep the tick log even when the drive fails, for postmortem.
      - name: Upload tick log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-drive-log-${{ github.run_id }}
          path: ${{ runner.temp }}/provisioning-drive.log
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # STAGE 3 - independent verification. Runs even if drive failed, so a partial
  # drive still gets its true end state recorded.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify final state
    needs: drive
    if: always() && needs.drive.result != 'skipped' && needs.drive.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo "::add-mask::${{ secrets.CRON_SECRET }}"
      - name: Confirm nothing left in flight
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash .github/scripts/provisioning-drive.sh verify

  # ---------------------------------------------------------------------------
  # STAGE 4 - report. always() so a failure anywhere still produces a summary.
  # ---------------------------------------------------------------------------
  report:
    name: Report
    needs: [preflight, sweep, drive, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise
        env:
          R_PRE: ${{ needs.preflight.result }}
          R_SWEEP: ${{ needs.sweep.result }}
          R_DRIVE: ${{ needs.drive.result }}
          R_VERIFY: ${{ needs.verify.result }}
          OUTCOME: ${{ needs.drive.outputs.outcome }}
          TICKS: ${{ needs.drive.outputs.ticks }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Provisioning worker - ${EVENT}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Preflight | ${R_PRE} |"
            echo "| Sweep | ${R_SWEEP} |"
            echo "| Drive | ${R_DRIVE} |"
            echo "| Verify | ${R_VERIFY} |"
            if [ -n "${OUTCOME:-}" ]; then
              echo ""
              echo "Drive outcome: ${OUTCOME} after ${TICKS:-0} tick(s)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          case "${OUTCOME:-}" in
            deadline)
              echo "::warning::Drive hit its time budget with work still in flight. Re-run this workflow - it is safe and resumes from the current step."
              ;;
            failed)
              echo "::error::A provisioning job FAILED. Auto-rollback was attempted; verify no orphaned RDS instance or S3 bucket is still billing."
              ;;
            config_error|unreachable|infra_error)
              echo "::error::Drive aborted (${OUTCOME}). No jobs were harmed - they resume on the next run."
              ;;
          esac

          # Fail the overall run if any stage genuinely failed.
          if [ "${R_PRE}" = "failure" ] || [ "${R_SWEEP}" = "failure" ] \
             || [ "${R_DRIVE}" = "failure" ] || [ "${R_VERIFY}" = "failure" ]; then
            echo "::error::One or more stages failed."
            exit 1
          fi

