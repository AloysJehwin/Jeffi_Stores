name: Jeffi Stores Pipeline

# One pipeline, one card per stage. Per-app stages are matrices (one job per app inside the card).
#
#   Init ─┬→ Lint (13) ───────┬→ Build · images (5) ──┐
#         ├→ Type check (13) ─┤                        │
#         │                   └→ Build + browser (Next ├→ Checks passed (required status; on a release, the approval)
#         │                      apps, affected) ──────┤
#         ├→ Security                                  │
#         ├→ Unit tests (12) → Coverage ───────────────┤
#         ├→ Integration tests · app, API tests · app ─┤  (affected apps only on a PR)
#         ├→ UI kit, Service API · service, Test ratchets
#         └→ Images (9, release only, after Lint and Type check)
#
# Init decides what a PR touches (scripts/affected.mjs: files to apps and services, store-core through
# scripts/component-owners.json). A push to main, workflow_dispatch and the nightly schedule run everything; a card
# for an unaffected app is skipped, which Checks passed accepts on a PR (a release needs every job green).
#
# Release (push to main, or workflow_dispatch with deploy=true): Checks passed waits for the one approval, then:
#
#   Checks passed ─→ DB · AWS · flagship ─┬→ Deploy · AWS · prepare ─→ Release · AWS · controller ─┬→ CloudFront ─→ Post
#   (approval)       DB · AWS · tenants  ─┘                            Release · AWS · storefront   │
#                                                                      Release · AWS · admin        │
#                                                                      Release · AWS · business     │
#                                                                      Release · AWS · messaging    │
#                                                                      Release · AWS · documents    │
#                                                                      Release · AWS · public-api   │
#                                                                      Release · AWS · mobile       │
#                                                                      Release · AWS · showcase     │
#                                                                      Release · AWS · ai-gateway   │
#                                                                      Release · AWS · razer ───────┘   (the LLM box's host services)
#   Mobile · Android (when the merge touched mobile-service/client) beside the DB card, after the approval.
#
# Two lanes, by two repository variables (deploy/azure/cutover/README.md flips both in its azure-live step):
#   FLAGSHIP_CLOUD unset or aws (before the cutover): the AWS lane above. With AZURE_TARGET=true the Azure lane also
#     runs, on standby: DB · Azure · flagship ─→ Deploy · Azure · prepare ─→ Release · Azure · <service>, rendered from
#     deploy/k8s/overlays/azure-standby (app CronJobs suspended, messaging, documents and voice at 0), no stores.
#   FLAGSHIP_CLOUD=azure (after it; needs AZURE_TARGET=true): the Azure lane is the release, stores included:
#     DB · Azure · flagship + tenants ─→ Deploy · Azure · prepare ─→ Release · Azure · <service> ─→ CloudFront ─→ Post.
#     Every AWS job is skipped: that cluster stays frozen and its RDS is the pre-cutover copy. So is razer: its path
#     is the AWS core (razer-release.sh), which stops at the cutover.
#
# One DB stage: the flagship (jeffi_stores, the platform set: schema diff, manual.sql, control-plane diff, plan
# seed, then migrations) and every store tenant's own database (the tenant set: the schema fan-out, then the tenant
# migrations, in a one-off Job from the release's controller image) side by side, each schema before its
# migrations (deploy/k8s/db/release-db.sh --flagship | --tenants). The schema is additive, so it lands while the old
# code runs. Deploy · AWS · prepare brings jeffi/store up to date, stops if the core can't fit the flagship's store pods
# and applies what the services share (with the release images new stores get). Then one job per service, side by
# side, each smoke-testing its own service: a platform service rolls its one deployment; a store service rolls the
# flagship's, then (once Release · AWS · controller is done, as the release's controller re-applies the stores) every
# store's that runs it, stopping at a store whose pods fail. Release · AWS · controller waits until the flagship's
# storefront, admin and business run the release (the store paths leave the controller first), then re-applies
# every store's namespace without its service pods. Release · AWS · messaging ends with the template catalog seed.
# Every stage after the approval runs in `production-release` (no reviewer) over an SSM tunnel; a failure stops
# what depends on it. Each stage computes the release tag from history. dry_run (default on by hand) builds the
# images and shows each stage's SQL, kubectl diff and targets without changing production.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # nightly full run (affected-only PRs rely on it as the safety net)
  workflow_dispatch:
    inputs:
      deploy:
        description: Run the release for this ref (pauses for approval)
        type: boolean
        default: false
      dry_run:
        description: Dry run — build images and show the database SQL, change nothing in production
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  # One heap ceiling for every Node step (tests, type checks, builds); runners have 16 GB.
  NODE_OPTIONS: --max-old-space-size=12288
  DRY_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
  # The deploy scripts read it (deploy/k8s/db/lib.sh): aws renders Azure on standby and keeps AWS; azure the reverse.
  FLAGSHIP_CLOUD: ${{ vars.FLAGSHIP_CLOUD || 'aws' }}

jobs:
  # ── Init ─────────────────────────────────────────────────────────────────────────────────────

  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
      mobile: ${{ steps.mobile.outputs.changed }}
      apps: ${{ steps.affected.outputs.apps }}
      rtl: ${{ steps.affected.outputs.rtl }}
      apidb: ${{ steps.affected.outputs.apidb }}
      browser: ${{ steps.affected.outputs.browser }}
      fastify: ${{ steps.affected.outputs.fastify }}
      ocr: ${{ steps.affected.outputs.ocr }}
      voice: ${{ steps.affected.outputs.voice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the image tag and release notes read history
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: affected
        name: What this change touches (everything on main, a manual run and the nightly)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          full='{"apps":["controller","storefront","admin","business","showcase"],"services":["messaging","documents","public-api","mobile","ai-gateway","ocr","voice","store-core"],"all":true}'
          out=$full
          if [ "$EVENT" = pull_request ]; then
            out=$(node scripts/affected.mjs "$BASE" HEAD) || { echo "::warning::scripts/affected.mjs failed; running everything"; out=$full; }
          fi
          echo "$out"
          {
            echo "apps=$(jq -c '.apps' <<<"$out")"
            # Integration (RTL) cards: the apps with RTL tests, and store-core when its own tests are affected.
            echo "rtl=$(jq -c '(.apps + (.services | map(select(. == "store-core")))) | map(select(IN("store-core","storefront","admin","controller")))' <<<"$out")"
            echo "apidb=$(jq -c '.apps | map(select(IN("storefront","admin","controller")))' <<<"$out")"
            echo "browser=$(jq -c '.apps | map({app: ., port: ({storefront:3010,admin:3011,business:3012,controller:3013,showcase:3014}[.])})' <<<"$out")"
            echo "fastify=$(jq -c '.services | map(select(IN("messaging","documents","public-api","mobile")))' <<<"$out")"
            echo "ocr=$(jq -r '.services | index("ocr") != null' <<<"$out")"
            echo "voice=$(jq -r '.services | index("voice") != null' <<<"$out")"
          } >> "$GITHUB_OUTPUT"
          { echo "### Affected"; echo '```json'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Every script a workflow runs is committed
        run: |
          set -euo pipefail
          missing=0
          for f in $(grep -ohE '(\.github/scripts|deploy)/[A-Za-z0-9_./-]+\.sh' .github/workflows/*.yml | sort -u); do
            [ -f "$f" ] || { echo "::error::$f is referenced by a workflow but not committed"; missing=1; }
          done
          exit $missing
      - id: mode
        name: Release or checks only
        run: echo "release=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}" >> "$GITHUB_OUTPUT"
      - id: mobile
        name: Did this release touch the mobile app
        if: steps.mode.outputs.release == 'true'
        # A merge commit's first parent is the previous main, so this spans the whole merged PR.
        run: echo "changed=$(git diff --quiet HEAD^1 HEAD -- mobile-service/client && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - id: notes
        name: What this release changes
        if: steps.mode.outputs.release == 'true'
        run: |
          set -euo pipefail
          tag=$(bash deploy/k8s/bootstrap/image-tag.sh)
          live=$(curl -fsS --max-time 15 https://jeffistores.in/api/health | sed -nE 's/.*"commit":"([0-9a-f]+)".*/\1/p' || true)
          {
            echo "## Release $tag (HEAD ${GITHUB_SHA::8})"; echo
            if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              schema=$(git diff --name-only "$live..HEAD" -- ':(glob)**/database/**' scripts/db-files.mjs deploy/schema-diff.sh deploy/k8s/db/manual.sql ':(glob,exclude)**/database/migrations/**' ':(glob,exclude)**/database/legacy/**')
              migrations=$(git diff --name-only "$live..HEAD" -- ':(glob)**/database/migrations/**')
              echo "Live: \`$live\`. Commits since:"; echo
              git log --max-count=60 --format='- %h %s' "$live..HEAD" # no pipe: head would SIGPIPE git log under pipefail
            else
              # Unknown live commit: run both steps (each is idempotent and applies only what is missing).
              schema="(live commit ${live:-unknown} not in this clone)"; migrations=$schema
              echo "Live commit \`${live:-unknown}\` is not in this clone; the database stages will run in full."
            fi
            echo
            if [ -n "$schema" ]; then echo "**Schema:** the DB stage applies the \`<service>/database/\` diff to jeffi_stores (platform set) and the tenant set to every store database:"; echo "$schema" | sed 's/^/- /'; else echo "**Schema:** unchanged."; fi
            echo
            if [ -n "$migrations" ]; then echo "**Migrations:** new \`<service>/database/migrations\` files:"; echo "$migrations" | sed 's/^/- /'; else echo "**Migrations:** no new files; the DB stage still runs any not yet recorded."; fi
            echo; echo "Approve the \`production\` environment to proceed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release lanes (FLAGSHIP_CLOUD, AZURE_TARGET)
        if: steps.mode.outputs.release == 'true'
        env:
          FLAGSHIP: ${{ vars.FLAGSHIP_CLOUD }}
          AZURE: ${{ vars.AZURE_TARGET }}
        run: |
          set -euo pipefail
          case "${FLAGSHIP:-aws}" in
            aws) lanes="AWS (flagship, stores, tenant databases, CloudFront)"
                 [ "$AZURE" != true ] || lanes="$lanes; Azure on standby (flagship database and platform; app CronJobs suspended, messaging, documents and voice at 0; no stores)" ;;
            azure) [ "$AZURE" = true ] || { echo "::error::FLAGSHIP_CLOUD=azure without AZURE_TARGET=true: no lane would release"; exit 1; }
                   lanes="Azure (flagship, stores, tenant databases, CloudFront); every AWS job skipped, razer included" ;;
            *) echo "::error::FLAGSHIP_CLOUD is '$FLAGSHIP': aws or azure"; exit 1 ;;
          esac
          { echo "**Release lanes:** $lanes"; echo; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Checks ───────────────────────────────────────────────────────────────────────────────────

  lint:
    name: Lint · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: controller, run: npx next lint controller-service --dir src }
          - { app: storefront, run: npx next lint storefront-service }
          - { app: admin, run: npx next lint admin-service }
          - { app: business, run: npx next lint business-service }
          - { app: showcase, run: npx next lint showcase-service }
          - { app: store-core, run: npx next lint controller-service --dir ../packages/store-core/src }
          - { app: messaging, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts messaging-service/src }
          - { app: documents, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts document-service/src }
          - { app: public-api, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts public-api-service/src }
          - { app: mobile, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts mobile-service/src }
          - { app: ai-gateway, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts ai-platform/gateway/src ai-platform/sdk }
          # The CLI's route manifest matches the route handlers; every route test mirrors a route.
          - { app: api-manifest, run: npm run cli:check }
          - { app: api-test-mirror, run: node scripts/check-api-test-mirror.mjs }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: ${{ matrix.run }}

  typecheck:
    name: Type check · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Next app with its tests; store-core also checks scripts/ and deploy/. Together they are root `tsc`.
          - { app: controller, run: npx tsc --noEmit -p controller-service/tsconfig.typecheck.json }
          - { app: storefront, run: npx tsc --noEmit -p storefront-service/tsconfig.typecheck.json }
          - { app: admin, run: npx tsc --noEmit -p admin-service/tsconfig.typecheck.json }
          - { app: business, run: npx tsc --noEmit -p business-service/tsconfig.typecheck.json }
          - { app: showcase, run: npx tsc --noEmit -p showcase-service/tsconfig.typecheck.json }
          - { app: store-core, run: npx tsc --noEmit -p packages/store-core/tsconfig.typecheck.json }
          - { app: messaging, run: npm --prefix messaging-service run typecheck }
          - { app: documents, run: npm --prefix document-service run typecheck }
          - { app: public-api, run: npm --prefix public-api-service run typecheck }
          - { app: mobile, run: npm --prefix mobile-service run typecheck }
          - { app: ai-gateway, install: npm --prefix ai-platform ci, run: npm --prefix ai-platform run typecheck }
          - { app: mobile-app, node: 22, install: npm --prefix mobile-service/client ci, run: npm --prefix mobile-service/client run typecheck }
          - { app: cli, run: npx tsc --noEmit -p packages/cli/tsconfig.json }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node || 20 }}
          install: ${{ matrix.install }}
      - run: ${{ matrix.run }}

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' }}
    permissions: { contents: read, pull-requests: write } # pull-requests: the dependency review's comment
    steps:
      - uses: actions/checkout@v4
      # A PR may not add or upgrade to a dependency with a known vulnerability, of any severity, in any manifest
      # (npm lockfiles, the PaddleOCR requirements). An exception goes in .github/audit-allowlist.json and in allow-ghsas.
      - name: No new vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Every lockfile stays clean, whatever the change: an advisory outside the allowlist fails the run.
      - name: npm audit (root, ai-platform, mobile app)
        run: node scripts/audit-gate.mjs
      - name: pip-audit (PaddleOCR)
        run: pipx run pip-audit==2.10.1 --requirement ai-platform/paddleocr/requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: pip-audit (voice-service)
        run: pipx run pip-audit==2.10.1 --requirement voice-service/requirements.txt --no-deps --disable-pip --progress-spinner off

  test:
    name: Unit tests · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    strategy:
      fail-fast: false
      matrix:
        include:
          # The root vitest projects each write a coverage part; Coverage merges them and checks the thresholds.
          - { app: controller, part: controller }
          - { app: storefront, part: storefront }
          - { app: admin, part: admin }
          - { app: business, part: business }
          - { app: showcase, part: showcase }
          - { app: store-core, part: store-core }
          - { app: cli, part: cli }
          # Each package is its own project + glob gate (the 80% effort). Parts merge into Coverage like the apps.
          - { app: service-auth, part: service-auth }
          - { app: tenancy, part: tenancy }
          - { app: wallet, part: wallet }
          - { app: pricing, part: pricing }
          - { app: gst, part: gst }
          - { app: bulk, part: bulk }
          - { app: draft-locks, part: draft-locks }
          - { app: list-filters, part: list-filters }
          - { app: push, part: push }
          - { app: mail-shell, part: mail-shell }
          - { app: site-blocks, part: site-blocks }
          - { app: api-contracts, part: api-contracts }
          - { app: design-tokens, part: design-tokens }
          # Standalone services run their own vitest with their own coverage gate (not merged into the root parts).
          - { app: messaging, run: npm --prefix messaging-service test -- --coverage }
          - { app: documents, run: npm --prefix document-service test -- --coverage }
          - { app: public-api, run: npm --prefix public-api-service test -- --coverage }
          - { app: mobile, run: npm --prefix mobile-service test -- --coverage }
          - { app: ai-gateway, install: npm --prefix ai-platform ci, run: npm --prefix ai-platform test -- --coverage }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          install: ${{ matrix.install }}
      - if: matrix.part
        run: npx vitest run --project ${{ matrix.part }} --passWithNoTests --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/${{ matrix.part }}.json
        env:
          VITEST_PART: '1'
      - if: matrix.part
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ matrix.part }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
      - if: matrix.run
        run: ${{ matrix.run }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test, security, integration, service-api, ratchets, ui-kit, voice] # stage 4: after stage 3's required suites
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-*
          path: .vitest-reports
          merge-multiple: true
      - run: npx vitest run --merge-reports --coverage

  integration:
    name: Integration tests · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.rtl != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.rtl) }}
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: npx vitest run --config vitest.integration.config.ts --project ${{ matrix.app }} --passWithNoTests

  api-db-tests:
    name: API tests (real DB) · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    if: needs.init.outputs.apidb != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.apidb) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16 # database/extensions.sql needs vector
        env:
          POSTGRES_USER: jeffi
          POSTGRES_PASSWORD: jeffi
          POSTGRES_DB: jeffi_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jeffi:jeffi@localhost:5432/jeffi_test
      API_DB: '1'
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - name: Schema into jeffi_test (platform + control-plane sets, manifest order)
        run: |
          set -uo pipefail
          for f in $(node scripts/db-files.mjs platform) $(node scripts/db-files.mjs control-plane); do
            psql "$DATABASE_URL" -q -f "$f" >/dev/null 2>"$RUNNER_TEMP/psql.err" || echo "::warning::$f: $(head -c 300 "$RUNNER_TEMP/psql.err")"
          done
          psql "$DATABASE_URL" -Atc "SELECT 1 FROM products, orders, cart_items, users, auth_sessions LIMIT 1" >/dev/null
      - name: Seed test fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/seed-test-db.sql
      - run: npm run test:db -- --project ${{ matrix.app }} --passWithNoTests

  # Each Next app is built once and its browser specs run against `next start` of that same build (a Postgres seeded
  # like the API tier). An app with no <app>-service/ui-tests specs only builds. Ports: storefront 3010, admin 3011,
  # business 3012, controller 3013, showcase 3014 (scripts/dev-router.ts DEV_PORTS).
  browser:
    name: Build + browser · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, security, integration, service-api, ratchets, ui-kit, voice] # stage 4: after stage 3's required suites; a lint or typecheck failure never spends a build
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.init.outputs.apps != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.init.outputs.browser) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jeffi
          POSTGRES_PASSWORD: jeffi
          POSTGRES_DB: jeffi_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jeffi:jeffi@localhost:5432/jeffi_test
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      UI_APP: ${{ matrix.app }}
      UI_BASE_URL: http://localhost:${{ matrix.port }}
      NEXT_PUBLIC_APP_URL: http://localhost:${{ matrix.port }}
      SKIP_DB_CHECK: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - id: specs
        name: Does ${{ matrix.app }}-service have browser specs
        run: |
          n=$(find "${{ matrix.app }}-service/ui-tests" -name '*.spec.ts' 2>/dev/null | wc -l)
          echo "has=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.app }}-service/.next/cache
          key: next-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-
      - name: Next.js build
        run: npm run build:${{ matrix.app }}
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      - if: steps.specs.outputs.has == 'true'
        name: Schema + seed jeffi_test
        run: |
          set -uo pipefail
          for f in $(node scripts/db-files.mjs platform) $(node scripts/db-files.mjs control-plane); do
            psql "$DATABASE_URL" -q -f "$f" >/dev/null 2>"$RUNNER_TEMP/psql.err" || echo "::warning::$f: $(head -c 300 "$RUNNER_TEMP/psql.err")"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/seed-test-db.sql
      - if: steps.specs.outputs.has == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.specs.outputs.has == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.specs.outputs.has == 'true'
        name: Start ${{ matrix.app }} and run its browser specs
        run: |
          npx next start ${{ matrix.app }}-service -p ${{ matrix.port }} > app.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ matrix.port }}/api/health || true)
            [ "$code" != 000 ] && break
            sleep 2
          done
          [ "$code" != 000 ] || { tail -50 app.log; exit 1; }
          npm run test:ui || { rc=$?; tail -50 app.log; exit $rc; }

  # The shared visible-page helper's own checks (tests/ui-kit): Chromium, no build.
  ui-kit:
    name: UI kit
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:kit

  # Branch protection requires these two names, the single jobs they were before the per-app split: each passes when its
  # cards did. On a PR an unaffected app's card is skipped; a release needs every card to succeed.
  api-db-required:
    name: API tests (real DB)
    runs-on: ubuntu-latest
    needs: [init, api-db-tests, security, integration, service-api, ratchets, ui-kit, voice] # stage 4: after stage 3's required suites
    if: always()
    steps:
      - name: Every API tests (real DB) card passed
        run: |
          r='${{ needs.api-db-tests.result }}'; rel='${{ needs.init.outputs.release }}'
          echo "init: ${{ needs.init.result }}, cards: $r"
          [ '${{ needs.init.result }}' = success ] || exit 1
          [ "$r" = success ] || { [ "$r" = skipped ] && [ "$rel" != true ]; } || { echo "::error::API tests (real DB): $r"; exit 1; }

  ui-required:
    name: UI tests (real browser)
    runs-on: ubuntu-latest
    needs: [init, browser, ui-kit]
    if: always()
    steps:
      - name: Every browser card and the UI kit passed
        run: |
          b='${{ needs.browser.result }}'; k='${{ needs.ui-kit.result }}'; rel='${{ needs.init.outputs.release }}'
          echo "init: ${{ needs.init.result }}, build + browser: $b, UI kit: $k"
          [ '${{ needs.init.result }}' = success ] || exit 1
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$rel" != true ]; }; }
          ok "$b" && ok "$k" || { echo "::error::UI tests (real browser): build + browser $b, UI kit $k"; exit 1; }

  # The Fastify services' route tests (Fastify inject), and every route has one (scripts/check-service-routes.mjs).
  service-api:
    name: Service API · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.fastify != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.init.outputs.fastify) }}
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      SERVICE_AUTH_SECRET: test-service-auth-secret
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: npm --prefix ${{ matrix.service == 'documents' && 'document' || matrix.service }}-service test
      - run: npm run check:service-routes
      - if: strategy.job-index == 0
        run: npm run test:service-routes

  # Shrink-only allowlists: a component or route without a test fails unless it is listed, and the manifest the
  # affected-only matrix reads is current.
  ratchets:
    name: Test ratchets
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: npm run check:component-tests
      - run: npm run check:route-tests
      - run: node scripts/component-owners.mjs --check
      - name: Every AI call goes through the AI gateway
        run: npm run check:ai-routing
      - run: npm run test:ai-routing

  # Advisory (not in Checks passed): paddlepaddle and its tree are heavy to install; promote it once it has proven
  # reliable and quick.
  ocr:
    name: OCR tests (advisory)
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.ocr == 'true' }}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-platform/paddleocr/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1
      - run: pip install -r ai-platform/paddleocr/requirements.txt pytest
      - run: pytest ai-platform/paddleocr/tests

  # voice-service (Python): pure-logic and contract tests, everything mocked (no calls, no network).
  voice:
    name: Voice service tests
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.voice == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: voice-service/requirements*.txt
      - run: pip install -r voice-service/requirements.txt -r voice-service/requirements-dev.txt
      - run: python -m pytest voice-service

  responsive:
    name: Responsive sweep (advisory)
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    # Advisory: not in `checks`' needs and continue-on-error, so it never blocks a merge. Skipped on a release run (its
    # PR already ran it, and Post fails a release on any failed job). Promote it once it has proven reliable.
    # Renders every site pack's pages at seven widths (tests/responsive, docs/SITE_BUILDER_PLAN.md §5), and the visual
    # editor's page (free layers, converted blocks), with a CLS and LCP budget per page (docs/plans/SITE_EDITOR_PLAN.md).
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.release != 'true' }}
    continue-on-error: true
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16 # database/extensions.sql needs vector
        env:
          POSTGRES_USER: jeffi
          POSTGRES_PASSWORD: jeffi
          POSTGRES_DB: jeffi_production_ready
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://jeffi:jeffi@localhost:5432/jeffi_production_ready
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SKIP_DB_CHECK: true
      SWEEP_BASE_URL: http://localhost:3000
      SWEEP_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - name: Schema into the job's Postgres (platform and control-plane sets, manifest order)
        run: |
          set -uo pipefail
          for f in $(node scripts/db-files.mjs platform) $(node scripts/db-files.mjs control-plane); do
            psql "$DATABASE_URL" -q -f "$f" >/dev/null 2>"$RUNNER_TEMP/psql.err" || echo "::warning::$f: $(head -c 300 "$RUNNER_TEMP/psql.err")"
          done
          psql "$DATABASE_URL" -Atc "SELECT 1 FROM site_drafts, site_pages, site_settings, products LIMIT 1" >/dev/null
      - run: npx playwright install --with-deps chromium
      - name: Build storefront and business
        run: npm run build:storefront && npm run build:business
      - name: Start the apps behind the dev router
        run: |
          npx next start storefront-service -p 3010 > storefront.log 2>&1 &
          npx next start business-service -p 3012 > business.log 2>&1 &
          npx tsx scripts/dev-router.ts > router.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:3000/ || { tail -50 storefront.log router.log; exit 1; }
      - run: npm run sweep:responsive
      - name: Summary
        if: always()
        run: |
          [ -f tests/responsive/output/summary.md ] && cat tests/responsive/output/summary.md >> "$GITHUB_STEP_SUMMARY"
          tail -30 storefront.log business.log 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-sweep
          path: |
            tests/responsive/output/summary.md
            tests/responsive/output/summary.json
            tests/responsive/output/findings.jsonl
            tests/responsive/output/screenshots
            tests/responsive/output/report
          if-no-files-found: ignore
          retention-days: 14

  site-editor-e2e:
    name: Site editor end-to-end (advisory)
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, api-db-tests, test] # stage 3: after stage 2, whatever its result
    # Advisory, like the responsive sweep: not in `checks`' needs and continue-on-error, skipped on a release run.
    # The visual editor in a real browser (docs/plans/SITE_EDITOR_PLAN.md phase 6): the canvas bridge on the storefront
    # and the editor in the admin Site Builder, behind the dev router so both share an origin as the editor's canvas
    # needs. tests/site-editor/seed.ts seeds jeffi_test (flag on, a draft, an admin session). Promote once reliable.
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.release != 'true' }}
    continue-on-error: true
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jeffi
          POSTGRES_PASSWORD: jeffi
          POSTGRES_DB: jeffi_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://jeffi:jeffi@localhost:5432/jeffi_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SKIP_DB_CHECK: true
      UI_BASE_URL: http://localhost:3000
      SITE_EDITOR_E2E: '1'
      # The AI spec's stand-in gateway (tests/site-editor/ai-mock.ts), which it starts on this port.
      AI_GATEWAY_URL: http://localhost:8098
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - name: Schema + seed jeffi_test
        run: |
          set -uo pipefail
          for f in $(node scripts/db-files.mjs platform) $(node scripts/db-files.mjs control-plane); do
            psql "$DATABASE_URL" -q -f "$f" >/dev/null 2>"$RUNNER_TEMP/psql.err" || echo "::warning::$f: $(head -c 300 "$RUNNER_TEMP/psql.err")"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/seed-test-db.sql
      - run: npx playwright install --with-deps chromium
      - name: Build storefront and admin
        run: npm run build:storefront && npm run build:admin
      - name: Start the apps behind the dev router
        run: |
          npx next start storefront-service -p 3010 > storefront.log 2>&1 &
          npx next start admin-service -p 3011 > admin.log 2>&1 &
          npx tsx scripts/dev-router.ts > router.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:3000/ || { tail -50 storefront.log router.log; exit 1; }
      - run: npx playwright test --config playwright.ui.config.ts storefront-service/ui-tests/site-editor admin-service/ui-tests/site-editor
      - name: Logs
        if: failure()
        run: tail -60 storefront.log admin.log router.log 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-editor-e2e
          path: tests/ui-output/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build · ${{ matrix.app }}
    runs-on: ubuntu-24.04-arm
    needs: [lint, typecheck, security, integration, service-api, ratchets, ui-kit, voice] # stage 4: after stage 3's required suites; a lint or typecheck failure never spends a build
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.typecheck.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Next apps build in Build + browser; the services run their TypeScript directly, so their build is the
          # image (arm64 like production, not pushed). The service caches are shared with the release Images stage.
          - { app: messaging, args: -f deploy/services.Dockerfile --target messaging . }
          - { app: documents, args: -f deploy/services.Dockerfile --target documents . }
          - { app: public-api, args: -f deploy/services.Dockerfile --target public-api . }
          - { app: mobile, args: -f deploy/services.Dockerfile --target mobile . }
          - { app: ai-gateway, args: -f ai-platform/gateway/Dockerfile ai-platform }
          - { app: voice, args: -f voice-service/Dockerfile . }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3 # exposes the cache endpoint buildx's gha cache needs
      - name: Image build (not pushed)
        run: docker buildx build --platform linux/arm64 --cache-from type=gha,scope=${{ matrix.app }} --cache-to type=gha,mode=max,scope=${{ matrix.app }} ${{ matrix.args }}

  images:
    name: Image · ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    needs: [init, lint, typecheck, security, integration, service-api, ratchets, ui-kit, voice] # stage 4: after stage 3's required suites
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.init.outputs.release == 'true' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: [controller, storefront, admin, business, messaging, documents, public-api, mobile, showcase, voice, ai-gateway]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # image_sha is the last commit that changed the image contents
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3 # exposes the cache endpoint buildx's gha cache needs
      - id: tag
        run: echo "tag=$(bash deploy/k8s/bootstrap/image-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Build and push (skipped when the tag already exists)
        env:
          BUILDX_CACHE_ARGS: --cache-from type=gha,scope=${{ matrix.service }} --cache-to type=gha,mode=max,scope=${{ matrix.service }}
          NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY: ${{ vars.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY }}
        run: bash deploy/k8s/bootstrap/build-push-ecr.sh "${{ matrix.service }}" "${{ steps.tag.outputs.tag }}"

  checks:
    name: Checks passed
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, security, test, coverage, integration, api-db-tests, browser, ui-kit, service-api, ratchets, voice, build, images]
    # A PR (or a release whose checks all passed) runs this; a release with a failed check skips it, so nobody is
    # asked to approve a broken build. On a release it is also the approval: the `production` environment.
    if: ${{ always() && (needs.init.outputs.release != 'true' || (needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.coverage.result == 'success' && needs.integration.result == 'success' && needs.api-db-tests.result == 'success' && needs.browser.result == 'success' && needs.ui-kit.result == 'success' && needs.service-api.result == 'success' && needs.ratchets.result == 'success' && needs.voice.result == 'success' && needs.build.result == 'success' && needs.images.result == 'success')) }}
    environment:
      name: ${{ needs.init.outputs.release == 'true' && 'production' || '' }}
      url: ${{ needs.init.outputs.release == 'true' && 'https://jeffistores.in' || '' }}
    steps:
      # A PR skips the cards of unaffected apps (`skipped` is fine) and fails on any `failure` or `cancelled`. A
      # release (every card runs) needs every job `success`, as before.
      - name: Every check succeeded
        env:
          RELEASE: ${{ needs.init.outputs.release }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ "$RELEASE" = true ]; then
            bad=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$NEEDS")
          else
            bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$NEEDS")
          fi
          [ -z "$bad" ] || { echo "::error::Checks failed: ${bad//$'\n'/ }"; exit 1; }
      - name: Approved for release
        if: needs.init.outputs.release == 'true'
        run: echo "Approved ${GITHUB_SHA::8} ${{ env.DRY_FLAG }}"

  # ── Release: one approval, the databases, then each service ─────────────────────────────────

  # Off once FLAGSHIP_CLOUD=azure: the stores' databases are then reached from the Azure cluster (db-azure · tenants).
  db-aws:
    name: DB · AWS · ${{ matrix.db }}
    runs-on: ubuntu-latest
    needs: checks
    if: vars.FLAGSHIP_CLOUD != 'azure'
    environment: production-release
    concurrency: { group: "deploy-production-db-${{ matrix.db }}", cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    strategy:
      fail-fast: false # the other database finishes what it started; either failing holds every service back
      matrix:
        db: [flagship, tenants]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Schema · ${{ matrix.db == 'flagship' && 'jeffi_stores (platform set diff, manual.sql, control-plane diff, plan seed)' || 'every store database (tenant set, in the release controller image)' }}
        run: bash deploy/k8s/db/release-db.sh --${{ matrix.db }} --schema --yes ${{ env.DRY_FLAG }}
      - name: Migrations · ${{ matrix.db == 'flagship' && 'pending files on jeffi_stores' || 'pending tenant-set files on every store database' }}
        run: bash deploy/k8s/db/release-db.sh --${{ matrix.db }} --migrations --yes ${{ env.DRY_FLAG }}
      - if: always()
        uses: ./.github/actions/db-report
        with: { name: "db-aws-${{ matrix.db }}" }

  # The databases on Azure (docs/plans/AZURE_MOVE_AND_AI_GATEWAY_PLAN.md). Off until AZURE_TARGET=true. Postgres is
  # reached through a kubectl port-forward over the tailnet (the k8s API), app_user's password read from Key Vault (deploy/k8s/db/lib.sh).
  # Before the cutover only the flagship; with FLAGSHIP_CLOUD=azure also tenants, the fan-out Job in the Azure cluster
  # (the stores rejoined it at the cutover).
  db-azure:
    name: DB · Azure · ${{ matrix.db }}
    runs-on: ubuntu-latest
    needs: checks
    if: vars.AZURE_TARGET == 'true'
    environment: production-release
    concurrency: { group: "deploy-production-db-azure-${{ matrix.db }}", cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    strategy:
      fail-fast: false
      matrix:
        db: ${{ fromJSON(vars.FLAGSHIP_CLOUD == 'azure' && '["flagship","tenants"]' || '["flagship"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/azure-release-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_AZURE_B64 }}
      - name: Schema · ${{ matrix.db == 'flagship' && 'jeffi_stores on Azure Postgres (platform set diff, manual.sql, control-plane diff, plan seed)' || 'every store database (tenant set, the release controller image in the Azure cluster)' }}
        run: bash deploy/k8s/db/release-db.sh --${{ matrix.db }} --schema --yes --cloud=azure ${{ env.DRY_FLAG }}
      - name: Migrations · ${{ matrix.db == 'flagship' && 'pending files on jeffi_stores (Azure)' || 'pending tenant-set files on every store database (Azure)' }}
        run: bash deploy/k8s/db/release-db.sh --${{ matrix.db }} --migrations --yes --cloud=azure ${{ env.DRY_FLAG }}
      - if: always()
        uses: ./.github/actions/db-report
        with: { name: "db-azure-${{ matrix.db }}" }

  deploy-prep-aws:
    name: Deploy · AWS · prepare
    runs-on: ubuntu-latest
    needs: db-aws
    if: vars.FLAGSHIP_CLOUD != 'azure'
    environment: production-release
    concurrency: { group: deploy-production-deploy-prep, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: jeffi/store from jeffi/production, without the control-plane keys (prints no values)
        run: bash deploy/k8s/bootstrap/store-secret.sh ${{ env.DRY_FLAG }}
      - name: jeffi/production/build matches jeffi/production's NEXT_PUBLIC_* keys (warns only; prints no values)
        run: bash deploy/k8s/bootstrap/build-secret.sh --check
      - name: Room on the core, the ECR pull secret, and what the services share (namespaces, edge, Redis, RBAC, config, release images)
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" platform prep ${{ env.DRY_FLAG }}

  # Off once FLAGSHIP_CLOUD=azure (the whole matrix, razer too: razer-release.sh goes through the AWS core).
  release-aws:
    name: Release · AWS · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: deploy-prep-aws
    if: vars.FLAGSHIP_CLOUD != 'azure'
    environment: production-release
    concurrency: { group: "deploy-production-release-${{ matrix.service }}", cancel-in-progress: false }
    permissions: { id-token: write, contents: read, actions: read }
    strategy:
      fail-fast: false # a service already rolling finishes; any failing still fails the release
      matrix:
        include:
          # platform: its one deployment. store: the flagship's, then every store's that runs it. razer: the Razer box's host services (PaddleOCR, the overlay), not the gateway.
          - { service: controller, kind: platform }
          - { service: storefront, kind: store }
          - { service: admin, kind: store }
          - { service: business, kind: store }
          - { service: messaging, kind: store }
          - { service: documents, kind: store }
          - { service: public-api, kind: platform }
          - { service: mobile, kind: platform }
          - { service: showcase, kind: platform }
          - { service: ai-gateway, kind: platform }
          - { service: razer, kind: razer }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - if: matrix.kind != 'razer'
        uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      # The controller is control plane only: it moves once the store paths have left it, i.e. once the flagship's
      # storefront, admin and business run the release (their jobs apply them); the routes and CronJobs come with it.
      - if: matrix.kind != 'razer'
        name: Flagship ${{ matrix.service }} at the release tag${{ matrix.service == 'controller' && ', with the platform routes and CronJobs' || '' }}
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" platform ${{ matrix.service }} ${{ env.DRY_FLAG }}
      - if: matrix.kind != 'razer'
        name: Smoke · flagship ${{ matrix.service }}
        run: bash deploy/k8s/bootstrap/smoke.sh "${TAG#local-}" ${{ matrix.service }} flagship ${{ env.DRY_FLAG }}
      - if: matrix.service == 'controller'
        name: Every store's namespace, routes and config; a store still on the old all-in-one app moves onto its own services
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" stores shared ${{ env.DRY_FLAG }}
      # The stores are re-applied by the release's controller, so a store service's stores wait for that job.
      - if: matrix.kind == 'store'
        uses: ./.github/actions/wait-for-job
        with: { job: "Release · AWS · controller", timeout-minutes: "90" }
      - if: matrix.kind == 'store'
        name: Every store's ${{ matrix.service }} at the release tag (a store without one is skipped)
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" stores ${{ matrix.service }} ${{ env.DRY_FLAG }}
      - if: matrix.kind == 'store'
        name: Smoke · stores' ${{ matrix.service }}
        run: bash deploy/k8s/bootstrap/smoke.sh "${TAG#local-}" ${{ matrix.service }} tenants ${{ env.DRY_FLAG }}
      - if: matrix.service == 'messaging'
        name: Templates · catalog (new catalog templates, email content for unedited copies, WhatsApp {{brand_name}} bodies; in the new messaging pod)
        run: bash deploy/k8s/db/50-seeds.sh ${{ env.DRY_FLAG }}
      # Post-deploy browser smoke (tests/post-deploy/<service>.spec.ts, read-only). Advisory for the first week: a
      # failure here never fails the release. Only a service with a public host and a spec runs it (the admin host
      # is not publicly reachable, and messaging and documents have none).
      - id: postdeploy
        if: matrix.kind != 'razer' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        name: Post-deploy smoke · ${{ matrix.service }} (which host)
        run: |
          case "${{ matrix.service }}" in
            controller) url=https://ecom.jeffistores.in/ ;;
            storefront) url=https://jeffistores.in/ ;;
            business) url=https://business.jeffistores.in/ ;;
            showcase) url="${{ vars.POST_DEPLOY_SHOWCASE_URL || 'https://site-smoke-check.jeffistores.in/' }}" ;;
            public-api) url=https://public.jeffistores.in/ ;;
            mobile) url=https://mobile.jeffistores.in/ ;;
            *) url= ;;
          esac
          # public-api and mobile share tests/post-deploy/services.spec.ts (URL from PUBLIC_API_URL / MOBILE_URL).
          spec=${{ matrix.service }}; case $spec in public-api|mobile) spec=services ;; esac
          [ -f "tests/post-deploy/$spec.spec.ts" ] || url=
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
      - if: steps.postdeploy.outputs.url != ''
        continue-on-error: true
        uses: ./.github/actions/node-setup
      - if: steps.postdeploy.outputs.url != ''
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - if: steps.postdeploy.outputs.url != ''
        continue-on-error: true
        name: Post-deploy browser smoke · ${{ matrix.service }}
        env:
          LIVE_URL: ${{ steps.postdeploy.outputs.url }}
          PUBLIC_API_URL: ${{ matrix.service == 'public-api' && steps.postdeploy.outputs.url || '' }}
          MOBILE_URL: ${{ matrix.service == 'mobile' && steps.postdeploy.outputs.url || '' }}
        run: npx playwright test -c playwright.post-deploy.config.ts tests/post-deploy/${{ steps.postdeploy.outputs.spec }}.spec.ts
      - if: matrix.kind == 'razer'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: matrix.kind == 'razer'
        name: Build and roll out PaddleOCR on the Razer box (SSM → core → Tailscale)
        run: bash deploy/k8s/bootstrap/razer-release.sh "$GITHUB_SHA" ${{ env.DRY_FLAG }}
      - if: matrix.kind == 'razer'
        name: Smoke · Razer LLM service (Ollama, the image server and PaddleOCR from the core, the way the gateway reaches them)
        run: bash deploy/k8s/bootstrap/razer-release.sh smoke

  # The platform on the Azure core (JEFFI_CLOUD=azure): what the services share first (namespaces, edge, Redis, RBAC,
  # config, the tenant edge's Traefik), then each service. Rendered from deploy/k8s/overlays/azure-standby until
  # FLAGSHIP_CLOUD=azure, from overlays/azure after it. The cluster is reached over the tailnet. Off until AZURE_TARGET=true.
  deploy-prep-azure:
    name: Deploy · Azure · prepare
    runs-on: ubuntu-latest
    needs: db-azure
    if: vars.AZURE_TARGET == 'true'
    environment: production-release
    concurrency: { group: deploy-production-deploy-prep-azure, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/azure-release-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_AZURE_B64 }}
      # The Azure controller copies jeffi-store into each store's namespace; the deploy identity reads the vault only.
      - if: vars.FLAGSHIP_CLOUD == 'azure'
        name: jeffi-store matches jeffi-production without the control-plane keys, in Key Vault (warns only; prints no values)
        run: bash deploy/k8s/bootstrap/store-secret.sh --check
      - if: vars.FLAGSHIP_CLOUD == 'azure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: vars.FLAGSHIP_CLOUD == 'azure'
        name: jeffi/production/build matches jeffi/production's NEXT_PUBLIC_* keys (warns only; prints no values)
        run: bash deploy/k8s/bootstrap/build-secret.sh --check
      - name: Room on the Azure core, the ECR pull secret, and what the services share
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" platform prep ${{ env.DRY_FLAG }}

  # The platform's services on the Azure core (docs/plans/AZURE_MOVE_AND_AI_GATEWAY_PLAN.md), as release-aws does on AWS.
  # Before the cutover only the flagship's deployments, on standby (no stores: they are in the AWS cluster). With
  # FLAGSHIP_CLOUD=azure the stores too (controller: stores shared; each store service: stores <service> after
  # it), the template seed and the post-deploy smoke. Until the DNS cutover, AZURE_INGRESS_IP (the core's public IP) has
  # the smoke tests reach the Azure ingress, not AWS; the cutover's azure-live step deletes it.
  release-azure:
    name: Release · Azure · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: deploy-prep-azure
    if: vars.AZURE_TARGET == 'true'
    environment: production-release
    concurrency: { group: "deploy-production-release-azure-${{ matrix.service }}", cancel-in-progress: false }
    permissions: { id-token: write, contents: read, actions: read }
    env:
      SMOKE_CONNECT_TO: ${{ vars.AZURE_INGRESS_IP && format('::{0}:', vars.AZURE_INGRESS_IP) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: controller, kind: platform }
          - { service: storefront, kind: store }
          - { service: admin, kind: store }
          - { service: business, kind: store }
          - { service: messaging, kind: store }
          - { service: documents, kind: store }
          - { service: public-api, kind: platform }
          - { service: mobile, kind: platform }
          - { service: showcase, kind: platform }
          - { service: ai-gateway, kind: platform }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/azure-release-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_AZURE_B64 }}
      - name: Flagship ${{ matrix.service }} at the release tag (Azure)${{ matrix.service == 'controller' && ', with the platform routes and CronJobs' || '' }}
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" platform ${{ matrix.service }} ${{ env.DRY_FLAG }}
      - name: Smoke · flagship ${{ matrix.service }} (Azure)
        run: bash deploy/k8s/bootstrap/smoke.sh "${TAG#local-}" ${{ matrix.service }} flagship ${{ env.DRY_FLAG }}
      - if: matrix.service == 'controller' && vars.FLAGSHIP_CLOUD == 'azure'
        name: Every store's namespace, routes and config; a store still on the old all-in-one app moves onto its own services (Azure)
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" stores shared ${{ env.DRY_FLAG }}
      - if: matrix.kind == 'store' && vars.FLAGSHIP_CLOUD == 'azure'
        uses: ./.github/actions/wait-for-job
        with: { job: "Release · Azure · controller", timeout-minutes: "90" }
      - if: matrix.kind == 'store' && vars.FLAGSHIP_CLOUD == 'azure'
        name: Every store's ${{ matrix.service }} at the release tag (a store without one is skipped; Azure)
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" stores ${{ matrix.service }} ${{ env.DRY_FLAG }}
      - if: matrix.kind == 'store' && vars.FLAGSHIP_CLOUD == 'azure'
        name: Smoke · stores' ${{ matrix.service }} (Azure)
        run: bash deploy/k8s/bootstrap/smoke.sh "${TAG#local-}" ${{ matrix.service }} tenants ${{ env.DRY_FLAG }}
      - if: matrix.service == 'messaging' && vars.FLAGSHIP_CLOUD == 'azure'
        name: Templates · catalog (new catalog templates, email content for unedited copies, WhatsApp {{brand_name}} bodies; in the new messaging pod)
        run: bash deploy/k8s/db/50-seeds.sh ${{ env.DRY_FLAG }}
      # Post-deploy browser smoke against the live hosts, as in release-aws (advisory); only once DNS points at Azure.
      - id: postdeploy
        if: vars.FLAGSHIP_CLOUD == 'azure' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        name: Post-deploy smoke · ${{ matrix.service }} (which host)
        run: |
          case "${{ matrix.service }}" in
            controller) url=https://ecom.jeffistores.in/ ;;
            storefront) url=https://jeffistores.in/ ;;
            business) url=https://business.jeffistores.in/ ;;
            showcase) url="${{ vars.POST_DEPLOY_SHOWCASE_URL || 'https://site-smoke-check.jeffistores.in/' }}" ;;
            public-api) url=https://public.jeffistores.in/ ;;
            mobile) url=https://mobile.jeffistores.in/ ;;
            *) url= ;;
          esac
          spec=${{ matrix.service }}; case $spec in public-api|mobile) spec=services ;; esac
          [ -f "tests/post-deploy/$spec.spec.ts" ] || url=
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
      - if: steps.postdeploy.outputs.url != ''
        continue-on-error: true
        uses: ./.github/actions/node-setup
      - if: steps.postdeploy.outputs.url != ''
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - if: steps.postdeploy.outputs.url != ''
        continue-on-error: true
        name: Post-deploy browser smoke · ${{ matrix.service }}
        env:
          LIVE_URL: ${{ steps.postdeploy.outputs.url }}
          PUBLIC_API_URL: ${{ matrix.service == 'public-api' && steps.postdeploy.outputs.url || '' }}
          MOBILE_URL: ${{ matrix.service == 'mobile' && steps.postdeploy.outputs.url || '' }}
        run: npx playwright test -c playwright.post-deploy.config.ts tests/post-deploy/${{ steps.postdeploy.outputs.spec }}.spec.ts

  # After the flagship's lane (AWS, or Azure once FLAGSHIP_CLOUD=azure); a service that failed does not hold it back.
  # CloudFront stays on AWS either way: the deploy role, no cluster.
  cdn:
    name: CloudFront
    runs-on: ubuntu-latest
    needs: [release-aws, release-azure]
    if: ${{ !cancelled() && (vars.FLAGSHIP_CLOUD == 'azure' && needs.release-azure.result || needs.release-aws.result) != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    environment: production-release
    concurrency: { group: deploy-production-cdn, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$id"
          echo "Invalidation $id complete"

  # ── Mobile ───────────────────────────────────────────────────────────────────────────────────
  # The Play Store app (mobile-service/client) rides the same approval as the web: after `production` is approved, a
  # JavaScript-only change ships as an EAS Update; a native change (new fingerprint) makes EAS build the signed app
  # bundle in Expo's cloud (versionCode auto-incremented there) and submit it to the Play internal track. Only when
  # the merge touched mobile-service/client. Needs the repo secrets
  # EXPO_TOKEN and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; without the latter it builds but does not submit.
  mobile-android:
    name: Mobile · Android
    runs-on: ubuntu-latest
    needs: [init, checks] # init for its outputs: without it in needs, needs.init is empty and the lane never ran
    if: needs.init.outputs.release == 'true' && needs.init.outputs.mobile == 'true'
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Expo SDK 58 needs Node 22.13+
          cache: npm
          cache-dependency-path: mobile-service/client/package-lock.json
      - run: npm --prefix mobile-service/client ci
      - name: Ship the app (over-the-air update, or a Play build when native code changed)
        working-directory: mobile-service/client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN secret is not set"; exit 1; }
          # The runtime version is a fingerprint of the native code. When it matches the last Play build's, the
          # JavaScript change ships as an EAS Update on the production channel (live in minutes, no Play review).
          rv=$(npx expo-updates runtimeversion:resolve --platform android | jq -r .runtimeVersion)
          last=$(npx eas-cli build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive 2>/dev/null | jq -r '.[0].runtimeVersion // empty' || true)
          echo "runtime ${rv}; last Play build ${last:-none}"
          if [ -n "$last" ] && [ "$rv" = "$last" ]; then
            npx eas-cli update --channel production --platform android --message "${GITHUB_SHA::8} $(git log -1 --format=%s)" --non-interactive | tee update.log
            { echo "## Mobile · Android"; echo; echo "- Native code unchanged (runtime \`${rv::12}\`): shipped as an **over-the-air update** on the production channel."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          submit=()
          if [ -n "$PLAY_SA" ]; then printf '%s' "$PLAY_SA" > play-service-account.json; submit=(--auto-submit); else echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set — building only; upload the .aab to Play Console by hand"; fi
          npx eas-cli build --platform android --profile production --non-interactive "${submit[@]}" | tee build.log
          url=$(grep -oE 'https://expo.dev/accounts/[^ ]+/builds/[0-9a-f-]+' build.log | tail -1 || true)
          { echo "## Mobile · Android"; echo; echo "- EAS build: ${url:-see log}"; [ -n "$PLAY_SA" ] && echo "- Submitted to the Play **internal** track; promote it in Play Console." || echo "- Not submitted (no Play service account secret)."; } >> "$GITHUB_STEP_SUMMARY"

  post:
    name: Post
    runs-on: ubuntu-latest
    needs: [release-aws, release-azure, cdn, mobile-android] # the last stage of each lane; the summary reads every stage from the run
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    permissions: { actions: read, contents: read }
    steps:
      - name: Release summary (every stage's result, from the run itself)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name != "Post") | "\(.name)\t\(.conclusion // .status)"')
          { echo "## Release ${GITHUB_SHA::8}"; echo; echo "| Stage | Result |"; echo "|---|---|"; echo "$jobs" | awk -F'\t' '{print "| " $1 " | " $2 " |"}'; } >> "$GITHUB_STEP_SUMMARY"
          if echo "$jobs" | awk -F'\t' '$2 == "failure" || $2 == "cancelled"' | grep -q .; then echo "::error::Release did not complete"; exit 1; fi
