name: Jeffi Stores Pipeline

# One pipeline, one card per stage. Per-app stages are matrices (one job per app inside the card).
#
#   Init ─┬→ Lint (6) ────────┬→ Build (9) ───────┐
#         ├→ Type check (7) ──┘                    │
#         ├→ Security                              ├→ Checks passed (required status; on a release, the approval)
#         ├→ Unit tests (6) ───────────────────────┤
#         ├→ Integration tests ────────────────────┘
#         └→ Images (8, release only, after Lint and Type check)
#
# Release (push to main, or workflow_dispatch with deploy=true): Checks passed waits for the one approval, then:
#   Checks passed (approval) ─┬→ DB · flagship schema ─────┬→ Deploy · flagship ───┬→ Smoke · flagship ─────────┬→ Deploy · tenants
#                             └→ DB · flagship migrations ─┤                       ├→ CloudFront               │   → Smoke · tenants → Post
#                                                          │                       ├→ DB · tenant schema ──────┤
#                                                          │                       └→ DB · tenant migrations ──┘
#                                                          └→ Deploy · AI gateway ──→ Smoke · AI gateway  (Razer box; only Post waits for it)
# Stacked stages start together; where order matters a stage waits for the one it depends on before doing
# anything (.github/actions/wait-for-job): flagship migrations after flagship schema, tenant schema after
# Smoke · flagship (no store is touched until the flagship is proven live), tenant migrations after tenant
# schema. Each stage computes the release tag from history, so it needs only the stages before it.
#
# Flagship first: the platform database (jeffi_stores) and the platform services, proven live before any store
# is touched. Tenants follow, since their schema fan-out runs inside the new controller. The schema is additive,
# so it lands while the old code runs. Every stage after the approval runs in `production-release` (no
# reviewer) over an SSM tunnel and a failure stops the rest. Both schema stages always run (they apply only what
# is missing). Deploy · flagship first brings jeffi/store (the store pods' secret) up to date from jeffi/production
# and stops if the core can't fit the flagship's store pods. dry_run (default on by hand) builds the images and
# shows each stage's SQL, kubectl diff and targets without changing production.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Run the release for this ref (pauses for approval)
        type: boolean
        default: false
      dry_run:
        description: Dry run — build images and show the database SQL, change nothing in production
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  DRY_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}

jobs:
  # ── Init ─────────────────────────────────────────────────────────────────────────────────────

  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
      mobile: ${{ steps.mobile.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the image tag and release notes read history
      - name: Every script a workflow runs is committed
        run: |
          set -euo pipefail
          missing=0
          for f in $(grep -ohE '(\.github/scripts|deploy)/[A-Za-z0-9_./-]+\.sh' .github/workflows/*.yml | sort -u); do
            [ -f "$f" ] || { echo "::error::$f is referenced by a workflow but not committed"; missing=1; }
          done
          exit $missing
      - id: mode
        name: Release or checks only
        run: echo "release=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}" >> "$GITHUB_OUTPUT"
      - id: mobile
        name: Did this release touch the mobile app
        if: steps.mode.outputs.release == 'true'
        # A merge commit's first parent is the previous main, so this spans the whole merged PR.
        run: echo "changed=$(git diff --quiet HEAD^1 HEAD -- mobile-service/client && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - id: notes
        name: What this release changes
        if: steps.mode.outputs.release == 'true'
        run: |
          set -euo pipefail
          tag=$(bash deploy/k8s/bootstrap/image-tag.sh)
          live=$(curl -fsS --max-time 15 https://jeffistores.in/api/health | sed -nE 's/.*"commit":"([0-9a-f]+)".*/\1/p' || true)
          {
            echo "## Release $tag (HEAD ${GITHUB_SHA::8})"; echo
            if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              schema=$(git diff --name-only "$live..HEAD" -- database deploy/schema-diff.sh deploy/k8s/db/manual.sql ':(exclude)database/migrations')
              migrations=$(git diff --name-only "$live..HEAD" -- database/migrations)
              echo "Live: \`$live\`. Commits since:"; echo
              git log --max-count=60 --format='- %h %s' "$live..HEAD" # no pipe: head would SIGPIPE git log under pipefail
            else
              # Unknown live commit: run both steps (each is idempotent and applies only what is missing).
              schema="(live commit ${live:-unknown} not in this clone)"; migrations=$schema
              echo "Live commit \`${live:-unknown}\` is not in this clone; the database stages will run in full."
            fi
            echo
            if [ -n "$schema" ]; then echo "**Schema:** the flagship schema stage applies the \`database/\` diff to jeffi_stores:"; echo "$schema" | sed 's/^/- /'; else echo "**Schema:** unchanged."; fi
            echo
            if [ -n "$migrations" ]; then echo "**Migrations:** new \`database/migrations\` files:"; echo "$migrations" | sed 's/^/- /'; else echo "**Migrations:** no new files; the migration stages still run any not yet recorded."; fi
            echo; echo "Approve the \`production\` environment to proceed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Checks ───────────────────────────────────────────────────────────────────────────────────

  lint:
    name: Lint · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: controller, run: npm run lint }
          - { app: messaging, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts messaging-service/src }
          - { app: documents, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts document-service/src }
          - { app: public-api, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts public-api-service/src }
          - { app: mobile, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts mobile-service/src }
          - { app: ai-gateway, run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts ai-platform/gateway/src ai-platform/sdk }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: ${{ matrix.run }}

  typecheck:
    name: Type check · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: controller, run: npx tsc --noEmit } # root tsconfig: every Next app, store-core, and their tests
          - { app: messaging, run: npm --prefix messaging-service run typecheck }
          - { app: documents, run: npm --prefix document-service run typecheck }
          - { app: public-api, run: npm --prefix public-api-service run typecheck }
          - { app: mobile, run: npm --prefix mobile-service run typecheck }
          - { app: ai-gateway, install: npm --prefix ai-platform ci, run: npm --prefix ai-platform run typecheck }
          - { app: mobile-app, install: npm --prefix mobile-service/client ci, run: npm --prefix mobile-service/client run typecheck }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          install: ${{ matrix.install }}
      - run: ${{ matrix.run }}

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: init
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  test:
    name: Unit tests · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: init
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: controller, run: npx vitest run --coverage --pool=forks }
          - { app: messaging, run: npm --prefix messaging-service test }
          - { app: documents, run: npm --prefix document-service test }
          - { app: public-api, run: npm --prefix public-api-service test -- --passWithNoTests }
          - { app: mobile, run: npm --prefix mobile-service test -- --passWithNoTests }
          - { app: ai-gateway, install: npm --prefix ai-platform ci, run: npm --prefix ai-platform test }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          install: ${{ matrix.install }}
      - run: ${{ matrix.run }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: init
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: npm run test:integration

  build:
    name: Build · ${{ matrix.app }}
    runs-on: ${{ matrix.runner }}
    needs: [lint, typecheck] # a commit failing either never spends a build
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Next apps compile here; the services run their TypeScript directly, so their build is the image
          # (arm64 like production, not pushed). The service caches are shared with the release Images stage.
          - { app: controller, runner: ubuntu-latest, kind: next }
          - { app: storefront, runner: ubuntu-latest, kind: next }
          - { app: admin, runner: ubuntu-latest, kind: next }
          - { app: business, runner: ubuntu-latest, kind: next }
          - { app: messaging, runner: ubuntu-24.04-arm, kind: image, args: -f deploy/services.Dockerfile --target messaging . }
          - { app: documents, runner: ubuntu-24.04-arm, kind: image, args: -f deploy/services.Dockerfile --target documents . }
          - { app: public-api, runner: ubuntu-24.04-arm, kind: image, args: -f deploy/services.Dockerfile --target public-api . }
          - { app: mobile, runner: ubuntu-24.04-arm, kind: image, args: -f deploy/services.Dockerfile --target mobile . }
          - { app: ai-gateway, runner: ubuntu-24.04-arm, kind: image, args: -f ai-platform/gateway/Dockerfile ai-platform }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.kind == 'next'
        uses: ./.github/actions/node-setup
      - name: Next.js build
        if: matrix.kind == 'next'
        run: npm run build:${{ matrix.app }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      - if: matrix.kind == 'image'
        uses: docker/setup-buildx-action@v3
      - if: matrix.kind == 'image'
        uses: crazy-max/ghaction-github-runtime@v3 # exposes the cache endpoint buildx's gha cache needs
      - name: Image build (not pushed)
        if: matrix.kind == 'image'
        run: docker buildx build --platform linux/arm64 --cache-from type=gha,scope=${{ matrix.app }} --cache-to type=gha,mode=max,scope=${{ matrix.app }} ${{ matrix.args }}

  images:
    name: Image · ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    needs: [init, lint, typecheck]
    if: needs.init.outputs.release == 'true'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: [controller, storefront, admin, business, messaging, documents, public-api, mobile]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # image_sha is the last commit that changed the image contents
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3 # exposes the cache endpoint buildx's gha cache needs
      - id: tag
        run: echo "tag=$(bash deploy/k8s/bootstrap/image-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Build and push (skipped when the tag already exists)
        env:
          BUILDX_CACHE_ARGS: --cache-from type=gha,scope=${{ matrix.service }} --cache-to type=gha,mode=max,scope=${{ matrix.service }}
          NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY: ${{ vars.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY }}
          NEXT_PUBLIC_ONDEVICE_MODEL_BASE: ${{ vars.NEXT_PUBLIC_ONDEVICE_MODEL_BASE }}
        run: bash deploy/k8s/bootstrap/build-push-ecr.sh "${{ matrix.service }}" "${{ steps.tag.outputs.tag }}"

  checks:
    name: Checks passed
    runs-on: ubuntu-latest
    needs: [init, lint, typecheck, security, test, integration, build, images]
    # A PR (or a release whose checks all passed) runs this; a release with a failed check skips it, so nobody is
    # asked to approve a broken build. On a release it is also the approval: the `production` environment.
    if: ${{ always() && (needs.init.outputs.release != 'true' || (needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.integration.result == 'success' && needs.build.result == 'success' && needs.images.result == 'success')) }}
    environment:
      name: ${{ needs.init.outputs.release == 'true' && 'production' || '' }}
      url: ${{ needs.init.outputs.release == 'true' && 'https://jeffistores.in' || '' }}
    steps:
      - name: Every check succeeded
        run: |
          r="${{ needs.init.result }} ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.security.result }} ${{ needs.test.result }} ${{ needs.integration.result }} ${{ needs.build.result }}"
          echo "Init, Lint, Type check, Security, Unit tests, Integration tests, Build: $r"
          [ "$r" = "success success success success success success success" ] || { echo "::error::Checks failed"; exit 1; }
      - name: Approved for release
        if: needs.init.outputs.release == 'true'
        run: echo "Approved ${GITHUB_SHA::8} ${{ env.DRY_FLAG }}"

  # ── Release: one approval, then flagship before tenants ──────────────────────────────────────

  db-flagship-schema:
    name: DB · flagship schema
    runs-on: ubuntu-latest
    needs: checks
    environment: production-release
    concurrency: { group: deploy-production-db-flagship-schema, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: jeffi_stores schema diff, manual.sql, control-plane diff and plan seed (applies only what is missing)
        run: bash deploy/k8s/db/release-db.sh --schema --yes ${{ env.DRY_FLAG }}
      - if: always()
        uses: ./.github/actions/db-report
        with: { name: "db-flagship-schema" }

  db-flagship-migrations:
    name: DB · flagship migrations
    runs-on: ubuntu-latest
    needs: checks # starts beside the schema stage; applies nothing until the schema has succeeded
    environment: production-release
    concurrency: { group: deploy-production-db-flagship-migrations, cancel-in-progress: false }
    permissions: { id-token: write, contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/wait-for-job
        with: { job: "DB · flagship schema" }
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Pending database/migrations files on jeffi_stores
        run: bash deploy/k8s/db/release-db.sh --migrations --yes ${{ env.DRY_FLAG }}
      - if: always()
        uses: ./.github/actions/db-report
        with: { name: "db-flagship-migrations" }

  deploy-ai-gateway:
    name: Deploy · AI gateway
    runs-on: ubuntu-latest
    needs: [db-flagship-schema, db-flagship-migrations] # beside Deploy · flagship; the stores never wait for it (the Razer box may be offline)
    environment: production-release
    concurrency: { group: deploy-production-deploy-ai-gateway, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build, roll out and smoke-test the gateway on the Razer box (SSM → core → Tailscale)
        run: bash deploy/k8s/bootstrap/razer-release.sh "$GITHUB_SHA" ${{ env.DRY_FLAG }}

  smoke-ai-gateway:
    name: Smoke · AI gateway
    runs-on: ubuntu-latest
    needs: deploy-ai-gateway # beside Smoke · flagship
    environment: production-release
    concurrency: { group: deploy-production-smoke-ai-gateway, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: /healthz and /v1/providers from the core, the way the platform reaches the gateway
        run: bash deploy/k8s/bootstrap/razer-release.sh smoke

  deploy-flagship:
    name: Deploy · flagship
    runs-on: ubuntu-latest
    needs: [db-flagship-schema, db-flagship-migrations]
    environment: production-release
    concurrency: { group: deploy-production-deploy-flagship, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: jeffi/store from jeffi/production, without the control-plane keys (prints no values)
        run: bash deploy/k8s/bootstrap/store-secret.sh ${{ env.DRY_FLAG }}
      - name: Controller, the flagship's storefront, admin and business, messaging, documents, public-api, mobile and CronJobs at the release tag
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" platform ${{ env.DRY_FLAG }}

  smoke-flagship:
    name: Smoke · flagship
    runs-on: ubuntu-latest
    needs: deploy-flagship
    environment: production-release
    concurrency: { group: deploy-production-smoke-flagship, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Live commit and every platform host
        run: bash deploy/k8s/bootstrap/smoke.sh "${TAG#local-}" flagship ${{ env.DRY_FLAG }}

  cdn:
    name: CloudFront
    runs-on: ubuntu-latest
    needs: deploy-flagship # beside the flagship smoke test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    environment: production-release
    concurrency: { group: deploy-production-cdn, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$id"
          echo "Invalidation $id complete"

  db-tenant-schema:
    name: DB · tenant schema
    runs-on: ubuntu-latest
    needs: deploy-flagship # starts beside Smoke · flagship; touches no store until that has passed
    environment: production-release
    concurrency: { group: deploy-production-db-tenant-schema, cancel-in-progress: false }
    permissions: { id-token: write, contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/wait-for-job
        with: { job: "Smoke · flagship" }
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Schema fan-out to every store's database
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" tenant-schema ${{ env.DRY_FLAG }}

  db-tenant-migrations:
    name: DB · tenant migrations
    runs-on: ubuntu-latest
    needs: deploy-flagship # starts beside the schema stage; applies nothing until the schema has succeeded
    environment: production-release
    concurrency: { group: deploy-production-db-tenant-migrations, cancel-in-progress: false }
    permissions: { id-token: write, contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/wait-for-job
        with: { job: "DB · tenant schema" }
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Pending migration files on every store's database
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" tenant-migrations ${{ env.DRY_FLAG }}

  deploy-tenants:
    name: Deploy · tenants
    runs-on: ubuntu-latest
    needs: [smoke-flagship, db-tenant-schema, db-tenant-migrations]
    environment: production-release
    concurrency: { group: deploy-production-deploy-tenants, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Every store's storefront, admin, business, messaging and document pods at the release tag, moving any still on the old app
        run: bash deploy/k8s/bootstrap/rollout.sh "$TAG" stores ${{ env.DRY_FLAG }}

  smoke-tenants:
    name: Smoke · tenants
    runs-on: ubuntu-latest
    needs: deploy-tenants
    environment: production-release
    concurrency: { group: deploy-production-smoke-tenants, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the release tag is computed from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: Every running store's health at the release commit
        run: bash deploy/k8s/bootstrap/smoke.sh "${TAG#local-}" tenants ${{ env.DRY_FLAG }}

  seed-templates:
    name: Templates · catalog
    runs-on: ubuntu-latest
    needs: [smoke-flagship, db-tenant-schema] # the scripts run in the new messaging pod; --tenant-dbs needs the store schema
    environment: production-release
    concurrency: { group: deploy-production-seed-templates, cancel-in-progress: false }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # release-setup computes the tag from history
      - uses: ./.github/actions/release-setup
        with: { role-arn: "${{ secrets.AWS_ROLE_ARN }}", kubeconfig-b64: "${{ secrets.KUBECONFIG_B64 }}" }
      - name: New catalog templates, email content for unedited copies, WhatsApp {{brand_name}} bodies
        run: bash deploy/k8s/db/50-seeds.sh ${{ env.DRY_FLAG }}

  # ── Mobile ───────────────────────────────────────────────────────────────────────────────────
  # The Play Store app (mobile-service/client) rides the same approval as the web: after `production` is approved, a
  # JavaScript-only change ships as an EAS Update; a native change (new fingerprint) makes EAS build the signed app
  # bundle in Expo's cloud (versionCode auto-incremented there) and submit it to the Play internal track. Only when
  # the merge touched mobile-service/client. Needs the repo secrets
  # EXPO_TOKEN and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; without the latter it builds but does not submit.
  mobile-android:
    name: Mobile · Android
    runs-on: ubuntu-latest
    needs: checks
    if: needs.init.outputs.release == 'true' && needs.init.outputs.mobile == 'true'
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-service/client/package-lock.json
      - run: npm --prefix mobile-service/client ci
      - name: Ship the app (over-the-air update, or a Play build when native code changed)
        working-directory: mobile-service/client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN secret is not set"; exit 1; }
          # The runtime version is a fingerprint of the native code. When it matches the last Play build's, the
          # JavaScript change ships as an EAS Update on the production channel (live in minutes, no Play review).
          rv=$(npx expo-updates runtimeversion:resolve --platform android | jq -r .runtimeVersion)
          last=$(npx eas-cli build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive 2>/dev/null | jq -r '.[0].runtimeVersion // empty' || true)
          echo "runtime ${rv}; last Play build ${last:-none}"
          if [ -n "$last" ] && [ "$rv" = "$last" ]; then
            npx eas-cli update --channel production --platform android --message "${GITHUB_SHA::8} $(git log -1 --format=%s)" --non-interactive | tee update.log
            { echo "## Mobile · Android"; echo; echo "- Native code unchanged (runtime \`${rv::12}\`): shipped as an **over-the-air update** on the production channel."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          submit=()
          if [ -n "$PLAY_SA" ]; then printf '%s' "$PLAY_SA" > play-service-account.json; submit=(--auto-submit); else echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set — building only; upload the .aab to Play Console by hand"; fi
          npx eas-cli build --platform android --profile production --non-interactive "${submit[@]}" | tee build.log
          url=$(grep -oE 'https://expo.dev/accounts/[^ ]+/builds/[0-9a-f-]+' build.log | tail -1 || true)
          { echo "## Mobile · Android"; echo; echo "- EAS build: ${url:-see log}"; [ -n "$PLAY_SA" ] && echo "- Submitted to the Play **internal** track; promote it in Play Console." || echo "- Not submitted (no Play service account secret)."; } >> "$GITHUB_STEP_SUMMARY"

  post:
    name: Post
    runs-on: ubuntu-latest
    needs: [smoke-tenants, seed-templates, cdn, smoke-ai-gateway, mobile-android]
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    permissions: { actions: read, contents: read }
    steps:
      - name: Release summary (every stage's result, from the run itself)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name != "Post") | "\(.name)\t\(.conclusion // .status)"')
          { echo "## Release ${GITHUB_SHA::8}"; echo; echo "| Stage | Result |"; echo "|---|---|"; echo "$jobs" | awk -F'\t' '{print "| " $1 " | " $2 " |"}'; } >> "$GITHUB_STEP_SUMMARY"
          if echo "$jobs" | awk -F'\t' '$2 == "failure" || $2 == "cancelled"' | grep -q .; then echo "::error::Release did not complete"; exit 1; fi
