name: Jeffi Stores Pipeline

# PR: lint, typecheck, tests, build (pr-gate). Push to main: the same, then the four service images are built
# and pushed to ECR (tag local-<image_sha>, shared with a Mac release), and the deploy job waits on the
# `production` environment for approval before running the same rollout a Mac runs
# (deploy/k8s/bootstrap/release.sh --rollout-only) over an SSM tunnel. The database is never changed here:
# release-notes flags database/*.sql changes so they can be applied by hand (deploy/k8s/db) before approving.
# workflow_dispatch with deploy=true exercises the release path from a branch (a re-release of tags that
# already exist is a no-op rollout).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Build images and roll out this ref (pauses for approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1

jobs:
  verify-scripts:
    name: Referenced scripts exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script a workflow runs is committed
        run: |
          set -euo pipefail
          missing=0
          for f in $(grep -ohE '(\.github/scripts|deploy)/[A-Za-z0-9_./-]+\.sh' .github/workflows/*.yml | sort -u); do
            [ -f "$f" ] || { echo "::error::$f is referenced by a workflow but not committed"; missing=1; }
          done
          exit $missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Controller
        run: npx tsc --noEmit
      - name: Services and packages
        run: npm run typecheck:services

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Controller tests with coverage
        run: npx vitest run --coverage --pool=forks
      - name: Integration / UI tests
        run: npm run test:integration
      - name: Service tests
        run: |
          npm --prefix messaging-service test
          npm --prefix document-service test
          npm --prefix public-api-service test -- --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Next.js build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [verify-scripts, lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - run: |
          echo "Scripts:    ${{ needs.verify-scripts.result }}"
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Test:       ${{ needs.test.result }}"
          echo "Build:      ${{ needs.build.result }}"
          [[ "${{ needs.verify-scripts.result }}${{ needs.lint.result }}${{ needs.typecheck.result }}${{ needs.test.result }}${{ needs.build.result }}" == "successsuccesssuccesssuccesssuccess" ]] ||
            { echo "PR Gate FAILED"; exit 1; }
          echo "PR Gate PASSED"

  # ── Release (push to main, or workflow_dispatch with deploy=true) ─────────────────────────────────────

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    needs: [verify-scripts, lint, typecheck, test, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: [controller, messaging, documents, public-api]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # image_sha is the last commit that changed the image contents
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3 # exposes the cache endpoint buildx's gha cache needs
      - id: tag
        run: echo "tag=$(bash deploy/k8s/bootstrap/image-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Build and push (skipped when the tag already exists)
        env:
          BUILDX_CACHE_ARGS: --cache-from type=gha,scope=${{ matrix.service }} --cache-to type=gha,mode=max,scope=${{ matrix.service }}
          NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY: ${{ vars.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY }}
          NEXT_PUBLIC_ONDEVICE_MODEL_BASE: ${{ vars.NEXT_PUBLIC_ONDEVICE_MODEL_BASE }}
        run: bash deploy/k8s/bootstrap/build-push-ecr.sh "${{ matrix.service }}" "${{ steps.tag.outputs.tag }}"

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    needs: [verify-scripts, lint, typecheck, test, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What this release changes, and whether the database must be updated first
        run: |
          set -euo pipefail
          tag=$(bash deploy/k8s/bootstrap/image-tag.sh)
          live=$(curl -fsS --max-time 15 https://jeffistores.in/api/health | sed -nE 's/.*"commit":"([0-9a-f]+)".*/\1/p')
          {
            echo "## Release $tag (HEAD ${GITHUB_SHA::8})"
            echo
            if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              echo "Live: \`$live\`. Commits since:"; echo
              git log --format='- %h %s' "$live..HEAD" | head -60
              db=$(git diff --name-only "$live..HEAD" -- database/ ':(exclude)database/migrations' || true)
              echo
              if [ -n "$db" ]; then
                echo "> ### Database changes in this release — apply them BEFORE approving the deploy"
                echo "> \`bash deploy/k8s/db/10-platform-schema.sh --dry-run\`, review, then without \`--dry-run\` (docs/GO_LIVE_RUNBOOK.md)."
                echo ">"; echo "$db" | sed 's/^/> - /'
              else
                echo "No \`database/\` changes since the live commit."
              fi
            else
              echo "Live commit \`${live:-unknown}\` is not in this clone; cannot list the changes. Check \`database/\` by hand before approving."
            fi
            echo; echo "Approve the \`production\` environment to roll out; a Mac release of the same commit uses the same tag."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [images, release-notes]
    environment:
      name: production
      url: https://jeffistores.in
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Session Manager plugin (the tunnel to the core)
        run: |
          command -v session-manager-plugin >/dev/null && exit 0
          curl -fsSL -o /tmp/smp.deb https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/smp.deb
      - name: Kubeconfig (k3s admin, server 127.0.0.1:16443 through the tunnel)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/jeffi-k3s.yaml
          chmod 600 ~/.kube/jeffi-k3s.yaml
      - name: Roll out ${{ needs.images.outputs.tag }}
        env:
          TUNNEL: ssm
          RELEASE_WORK_DIR: ${{ runner.temp }}/release
        run: bash deploy/k8s/bootstrap/release.sh --rollout-only
      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$id"
          echo "Invalidation $id complete"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs
          path: ${{ runner.temp }}/release
          if-no-files-found: ignore

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [verify-scripts, lint, typecheck, test, build, pr-gate, images, release-notes, deploy]
    if: always()
    steps:
      - run: |
          echo "Scripts:        ${{ needs.verify-scripts.result }}"
          echo "Lint:           ${{ needs.lint.result }}"
          echo "Type Check:     ${{ needs.typecheck.result }}"
          echo "Test:           ${{ needs.test.result }}"
          echo "Build:          ${{ needs.build.result }}"
          echo "PR Gate:        ${{ needs.pr-gate.result }}"
          echo "Images:         ${{ needs.images.result }}"
          echo "Release notes:  ${{ needs.release-notes.result }}"
          echo "Deploy:         ${{ needs.deploy.result }}"
          case "${{ needs.verify-scripts.result }} ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.pr-gate.result }} ${{ needs.images.result }} ${{ needs.release-notes.result }} ${{ needs.deploy.result }}" in
            *failure*|*cancelled*) echo "Pipeline FAILED"; exit 1 ;;
          esac
          echo "Pipeline OK"
