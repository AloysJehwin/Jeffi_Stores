name: Jeffi Stores Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────
  # Stage 0 — Detect entity schema changes  (main push only)
  # Watches database/*.sql (not migrations/) — triggers schema-diff job
  # ────────────────────────────────────────────────────────
  check-schema:
    name: Check for Schema Changes
    runs-on: ubuntu-latest
    outputs:
      schema_changed: ${{ steps.detect.outputs.schema_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect entity SQL file changes
        id: detect
        run: |
          # NOTE: the previous pattern was [^/]+ which matched only files DIRECTLY under
          # database/, so database/control-plane/schema.sql never triggered a diff and the
          # control plane silently drifted. .+ covers subdirectories.
          # schema-diff.sh itself counts too: a fix to the differ must actually run, or it
          # sits dormant until the next unrelated schema edit while the drift it repairs
          # stays live.
          if git diff --name-only HEAD~1 HEAD | grep -qP '^(database/(?!migrations/).+\.sql|deploy/schema-diff\.sh)'; then
            echo "schema_changed=true" >> $GITHUB_OUTPUT
            echo "Entity SQL files changed — will schema-diff against live RDS"
          else
            echo "schema_changed=false" >> $GITHUB_OUTPUT
            echo "No entity SQL changes — skipping schema-diff job"
          fi

  # ────────────────────────────────────────────────────────
  # Stage 0 — Detect migration changes  (main push only)
  # Watches database/migrations/*.sql — triggers run-migrations job
  # ────────────────────────────────────────────────────────
  check-migrations:
    name: Check for Migration Changes
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.detect.outputs.migrations_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect migration file changes
        id: detect
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^database/migrations/.*\.sql'; then
            echo "migrations_changed=true" >> $GITHUB_OUTPUT
            echo "Migration files changed — will apply to RDS after deploy"
          else
            echo "migrations_changed=false" >> $GITHUB_OUTPUT
            echo "No migration files changed — skipping migrate job"
          fi

  # ────────────────────────────────────────────────────────
  # Stage 1 — Lint  (PR + main)
  # ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────
  # Stage 1 — Type Check  (PR + main, parallel with lint)
  # ────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────────────
  # Stage 2 — Test + Coverage  (PR + main, gate: lint + typecheck)
  # ────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run tests with coverage
        run: npx vitest run --coverage --pool=forks
        env:
          JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
          CRON_SECRET: test-cron-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
          RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
          DELHIVERY_API_KEY: test-delhivery-key
          GOOGLE_CLIENT_ID: test-google-client-id

  # ────────────────────────────────────────────────────────
  # Stage 3 — Build  (PR + main, gate: test)
  # ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 3 — Docker build & push  (main only, gate: build)
  # ────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch NEXT_PUBLIC vars from Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id jeffi/production \
            --query SecretString --output text)
          # Write every NEXT_PUBLIC_ key from the secret into $GITHUB_ENV so
          # subsequent steps see them as environment variables and they can be
          # passed as docker --build-arg values.
          echo "$SECRET" | node -e "
            const s = require('fs').readFileSync('/dev/stdin','utf8');
            const obj = JSON.parse(s);
            const lines = Object.entries(obj)
              .filter(([k]) => k.startsWith('NEXT_PUBLIC_'))
              .map(([k,v]) => k + '=' + v)
              .join('\n');
            require('fs').appendFileSync(process.env.GITHUB_ENV, lines + '\n');
          "

      # NEXT_PUBLIC_* values are inlined at build time, so an empty one ships a broken
      # image that only fails in the browser. 5b8c0ffa moved these to Secrets Manager but
      # seeded it from GitHub *secrets*, missing NEXT_PUBLIC_ONDEVICE_MODEL_BASE, which was
      # a repo *variable* — the on-device flag stayed on while its model URL went empty, so
      # every visitor 404'd on a 437MB model fetched from the wrong origin.
      - name: Assert required NEXT_PUBLIC build args are non-empty
        env:
          VAR_ENABLE_ONDEVICE_SUMMARY: ${{ vars.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY }}
          VAR_ONDEVICE_MODEL_BASE: ${{ vars.NEXT_PUBLIC_ONDEVICE_MODEL_BASE }}
        run: |
          # Mirror the build-arg fallback below: these two live in repo variables, not the
          # Secrets Manager blob, so check the same resolved value the build will use.
          : "${NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY:=${VAR_ENABLE_ONDEVICE_SUMMARY}}"
          : "${NEXT_PUBLIC_ONDEVICE_MODEL_BASE:=${VAR_ONDEVICE_MODEL_BASE}}"
          fail=0
          require() {
            if [ -z "${!1}" ]; then echo "::error::$1 is empty — $2"; fail=1; fi
          }
          require NEXT_PUBLIC_BASE_URL "site links and canonical URLs break"
          require NEXT_PUBLIC_APP_URL "OAuth redirects break"
          if [ "$NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY" = "true" ] || [ "$NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY" = "1" ]; then
            require NEXT_PUBLIC_ONDEVICE_MODEL_BASE "on-device summary is enabled but the model would be fetched from this origin, which does not host it"
          fi
          [ "$fail" = "0" ] || { echo "Refusing to build an image with missing public config."; exit 1; }

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://localhost:5432/dummy
            JWT_SECRET=ci-build-secret
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            SKIP_DB_CHECK=true
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ env.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_ENABLE_RAZORPAY=${{ env.NEXT_PUBLIC_ENABLE_RAZORPAY }}
            NEXT_PUBLIC_ENABLE_GST=${{ env.NEXT_PUBLIC_ENABLE_GST }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY=${{ env.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY || vars.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY }}
            NEXT_PUBLIC_ONDEVICE_MODEL_BASE=${{ env.NEXT_PUBLIC_ONDEVICE_MODEL_BASE || vars.NEXT_PUBLIC_ONDEVICE_MODEL_BASE }}

  # ────────────────────────────────────────────────────────
  # Stage 4 — Deploy to EC2  (main only, gate: docker)
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.result }}
    steps:
      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'EC2 rolling deploy to jeffistores.in',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            return dep.data.id;

      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Blue-green deploy (zero downtime)
        uses: appleboy/ssh-action@v1
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: GH_DEPLOY_TOKEN,GH_REPOSITORY,GH_ACTOR
          script: |
            set -e
            cd /opt/jeffi-stores

            echo "── Pulling latest code ──"
            git config credential.helper '!f(){ echo "username=x-token"; echo "password=$GH_DEPLOY_TOKEN"; };f'
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "── Logging in to GHCR ──"
            echo "$GH_DEPLOY_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # nginx's config is bind-mounted as a single FILE, which Docker resolves once, by
            # inode. `git reset --hard` above writes a NEW inode, so the running container keeps
            # serving the old content indefinitely — a config change appears deployed but never
            # takes effect. That silently disabled tenant mTLS for 11 days: the admin-{slug}
            # block's ssl_verify_client never reached nginx, so browsers were never asked for a
            # client certificate. Only recreating the container re-resolves the mount.
            # The tenant admin block advertises this bundle so browsers can offer the right
            # client certificate. Rebuilt before the freshness check below, because adding a
            # tenant changes the bundle without changing nginx-servers.conf.
            echo "── client CA bundle ──"
            BUNDLE=/opt/jeffi-stores/certs/client-ca-bundle.pem
            BUNDLE_BEFORE=$(md5sum "$BUNDLE" 2>/dev/null | awk '{print $1}' || true)
            sudo -E bash deploy/build-client-ca-bundle.sh "$BUNDLE"
            BUNDLE_AFTER=$(md5sum "$BUNDLE" 2>/dev/null | awk '{print $1}' || true)

            echo "── nginx config ──"
            HOST_MD5=$(md5sum deploy/nginx-servers.conf | awk '{print $1}')
            CONT_MD5=$(docker exec jeffi-nginx md5sum /etc/nginx/conf.d/servers.conf 2>/dev/null | awk '{print $1}' || true)
            if [ "$HOST_MD5" != "$CONT_MD5" ] || [ "$BUNDLE_BEFORE" != "$BUNDLE_AFTER" ]; then
              echo "nginx config or CA bundle changed — validating before restart"
              NET=$(docker inspect jeffi-nginx --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
              # Validate in a throwaway container first: restarting into a bad config would take
              # every site on this box down.
              docker run --rm --network "$NET" \
                -v /etc/letsencrypt:/etc/letsencrypt:ro \
                -v /opt/jeffi-stores/certbot-webroot:/var/www/certbot:ro \
                -v /opt/jeffi-stores/certs:/etc/nginx/certs:ro \
                -v /opt/jeffi-stores/deploy/active-upstream.conf:/etc/nginx/conf.d/upstream.conf:ro \
                -v /opt/jeffi-stores/deploy/nginx-servers.conf:/etc/nginx/conf.d/servers.conf:ro \
                nginx:alpine nginx -t
              docker restart jeffi-nginx
              echo "nginx restarted on the new config"
            else
              echo "nginx config unchanged"
            fi

            # Publish the same config for the tenant fleet. Pool boxes have no deploy token and
            # so cannot pull the repo; they fetch these two files with their instance profile.
            # The CA bundle has to be built here because only this box can reach the control
            # plane to enumerate tenant_ca.
            echo "── publishing fleet config ──"
            aws s3 cp "$BUNDLE" s3://jeffi-stores-mtls-truststore/fleet/client-ca-bundle.pem --only-show-errors
            aws s3 cp deploy/nginx-servers.conf s3://jeffi-stores-mtls-truststore/fleet/nginx-servers.conf --only-show-errors
            aws s3 cp deploy/fleet-apply.sh s3://jeffi-stores-mtls-truststore/fleet/fleet-apply.sh --only-show-errors
            echo "fleet config published" 

            echo "── Blue-green deploy ──"
            bash deploy/blue-green-deploy.sh

            echo "── Pruning old images ──"
            docker image prune -f

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'EC2 deploy failed — check logs',
            });

  # ────────────────────────────────────────────────────────
  # Stage 5 — Schema Diff + Apply  (main only, gate: deploy + schema changed)
  # Loads database/*.sql into temp Postgres, diffs vs live RDS via migra,
  # applies only the delta. You edit the entity file — pipeline handles the rest.
  # ────────────────────────────────────────────────────────
  schema-diff:
    name: Schema Diff & Apply
    runs-on: ubuntu-latest
    needs: [deploy, check-schema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-schema.outputs.schema_changed == 'true'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Run schema diff and apply via EC2
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          # ssh-action only forwards variables named here; the fan-out records this SHA per
          # tenant so a re-run can skip stores that already have it.
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /opt/jeffi-stores

            export RDS_HOST=jeffi-stores-db.cjmaa6acimgm.us-east-1.rds.amazonaws.com
            export RDS_PORT=5432
            export RDS_USER=app_user
            export AWS_REGION=us-east-1

            # Platform store DB
            RDS_DB=jeffi_stores bash deploy/schema-diff.sh --set=platform

            # SaaS control plane - previously never diffed, which is how it ended up
            # missing tenant_ca/tenant_admin_certs and provisioning_jobs.next_attempt_at.
            RDS_DB=jeffi_control_plane bash deploy/schema-diff.sh --set=control-plane

            # Every tenant's own database. The two diffs above only ever touched the flagship
            # and the control plane, so a schema change on main never reached a customer store
            # — their databases silently fell behind the code deployed to serve them.
            #
            # Not migra: each tenant gets the same desired-state schema applied idempotently,
            # which is far cheaper than diffing N databases and is what the provisioning path
            # already uses. runMigrationFanout skips tenants already recorded at this SHA and
            # isolates failures per tenant, so one bad store cannot block the rest.
            echo "── Tenant schema fan-out ──"
            CRON_SECRET=$(docker exec jeffi-app-$(cat active_slot 2>/dev/null || echo blue) printenv CRON_SECRET 2>/dev/null || true)
            if [ -z "$CRON_SECRET" ]; then
              echo "::error::CRON_SECRET unavailable — cannot run the tenant fan-out"
              exit 1
            fi
            CODE=$(curl -s -o /tmp/fanout.json -w '%{http_code}' --max-time 300 \
              -X POST http://localhost/api/internal/migrations/fanout \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H 'Content-Type: application/json' \
              -H 'Host: jeffistores.in' \
              -d "{\"gitSha\":\"$DEPLOY_SHA\"}")
            cat /tmp/fanout.json; echo
            rm -f /tmp/fanout.json
            [ "$CODE" = "200" ] || { echo "::error::tenant schema fan-out failed (HTTP $CODE)"; exit 1; }

  # ────────────────────────────────────────────────────────
  # Stage 4b — Roll the same image onto every tenant-serving box
  # ────────────────────────────────────────────────────────
  # The flagship deploy above targets one pinned instance. Tenant stores are served by pool
  # boxes, which only ever pulled :latest at BOOT — so a change on main reached jeffistores.in
  # and never reached a customer storefront. They ran whatever image existed the day they
  # launched.
  #
  # Driven over SSM rather than SSH: the pool security group opens 22 to a single fixed IP,
  # and GitHub runners have rotating addresses, so there is no SSH path from CI that does not
  # mean opening the box to the internet. SSM needs no inbound port at all.
  #
  # Each box runs deploy/fleet-apply.sh, fetched from S3 because a pool box has no deploy token
  # and cannot pull the repo. That script syncs the nginx config and client-CA bundle the
  # flagship published, then runs the SAME deploy/blue-green-deploy.sh the flagship uses — so a
  # box that comes up unhealthy keeps serving its current version instead of going dark.
  deploy-fleet:
    name: Deploy to tenant fleet
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Roll every pool instance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail

          # Tag-selected, not a hardcoded list: the pool scales with tenant count, so any
          # fixed set would silently miss boxes added since it was written.
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=jeffi-tenant" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)

          if [ -z "$IDS" ]; then
            echo "No running tenant instances — nothing to roll."
            exit 0
          fi
          echo "Targets: $IDS"

          # An instance whose SSM agent is not registered cannot be reached, and skipping it
          # silently would leave that box's tenants on stale code with a green pipeline.
          MANAGED=$(aws ssm describe-instance-information \
            --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' --output text)
          MISSING=""
          for id in $IDS; do
            case " $MANAGED " in *" $id "*) : ;; *) MISSING="$MISSING $id" ;; esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::not reachable over SSM:$MISSING"
            exit 1
          fi

          FAILED=""
          for id in $IDS; do
            echo "── $id ──"
            CMD=$(aws ssm send-command --instance-ids "$id" \
              --document-name AWS-RunShellScript \
              --comment "deploy ${GITHUB_SHA:0:7}" \
              --parameters 'commands=["set -e","aws s3 cp s3://jeffi-stores-mtls-truststore/fleet/fleet-apply.sh /tmp/fleet-apply.sh --only-show-errors","bash /tmp/fleet-apply.sh","rm -f /tmp/fleet-apply.sh"]' \
              --query 'Command.CommandId' --output text)

            # Poll rather than `aws ssm wait`: the blue-green health check alone allows five
            # minutes, and the wait command gives up sooner than that.
            STATUS=InProgress
            for _ in $(seq 1 60); do
              sleep 10
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" \
                --query 'Status' --output text 2>/dev/null || echo Pending)
              case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            done

            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" \
              --query 'StandardOutputContent' --output text 2>/dev/null | tail -20
            if [ "$STATUS" != "Success" ]; then
              echo "::error::$id finished $STATUS"
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" \
                --query 'StandardErrorContent' --output text 2>/dev/null | tail -20
              FAILED="$FAILED $id"
            else
              echo "$id updated"
            fi
          done

          # Boxes that succeeded are already serving the new image and must not be rolled back
          # to match the ones that did not — each tenant is pinned to a box by DNS, so a mixed
          # fleet is safe. Fail loudly and name the stragglers instead.
          if [ -n "$FAILED" ]; then
            echo "::error::tenant fleet deploy failed on:$FAILED"
            exit 1
          fi
          echo "Tenant fleet up to date."

  # ────────────────────────────────────────────────────────
  # Stage 5 — Run DB Migrations  (main only, gate: deploy + migrations changed)
  # Applies only unapplied files from database/migrations/ via run-migrations.sh.
  # Tracks applied migrations in schema_migrations table on RDS.
  # ────────────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [deploy, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.migrations_changed == 'true'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Apply pending migrations via EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/jeffi-stores

            export RDS_HOST=jeffi-stores-db.cjmaa6acimgm.us-east-1.rds.amazonaws.com
            export RDS_PORT=5432
            export RDS_USER=app_user
            export RDS_DB=jeffi_stores
            export AWS_REGION=us-east-1

            bash deploy/run-migrations.sh

  # ────────────────────────────────────────────────────────
  # Stage 6 — Smoke test  (main only, gate: deploy + CDN invalidation)
  # Hits the real domain health endpoint THROUGH CloudFront→nginx (nginx routes by
  # server_name jeffistores.in, so a bare EC2-IP request never matched — that was
  # the post-blue-green failure). Runs after invalidate-cdn so the edge cache is
  # already cleared, and asserts 200 + {"status":"ok"} from /api/health.
  # ────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy, invalidate-cdn]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Health check (domain /api/health via CDN)
        run: |
          URL="https://jeffistores.in/api/health"
          echo "Smoke-testing $URL ..."
          LAST_STATUS="000"; LAST_BODY=""
          for i in $(seq 1 12); do
            LAST_STATUS=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            LAST_BODY=$(cat /tmp/health.json 2>/dev/null || echo "")
            echo "Attempt $i: HTTP $LAST_STATUS  body=$LAST_BODY"
            if [[ "$LAST_STATUS" == "200" ]] && echo "$LAST_BODY" | grep -q '"status":"ok"'; then
              echo "Smoke test passed — app is healthy at the edge."
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test FAILED after 2 minutes. Last HTTP $LAST_STATUS, body: $LAST_BODY"
          exit 1

  # ────────────────────────────────────────────────────────
  # Stage 7 — Invalidate CDN  (main only, gate: deploy)
  # Runs as soon as the new image is live so cached 30x/HTML at the edge
  # gets cleared before the smoke test, not after. Also waits for the
  # invalidation to complete so the next stage sees a clean cache.
  # ────────────────────────────────────────────────────────
  invalidate-cdn:
    name: Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create invalidation and wait
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INV_ID created — waiting for completion..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INV_ID"
          echo "Invalidation $INV_ID complete."

  # ────────────────────────────────────────────────────────
  # Stage 8 — Finalize deployment  (main only)
  # Marks the GitHub deployment success ONLY when deploy AND smoke both passed,
  # else failure. This moves the success signal after the smoke gate so a bad
  # deploy that serves an unhealthy app is never marked successful.
  # ────────────────────────────────────────────────────────
  finalize-deploy:
    name: Finalize Deployment
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Mark deployment status from smoke result
        uses: actions/github-script@v7
        with:
          script: |
            const depId = ${{ needs.deploy.outputs.deployment_id }};
            const ok = '${{ needs.deploy.result }}' === 'success' && '${{ needs.smoke-test.result }}' === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: depId,
              state: ok ? 'success' : 'failure',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: ok ? 'Deployed and smoke-tested successfully' : 'Deploy or smoke test failed',
            });
            if (!ok) core.setFailed('Deployment not healthy (deploy or smoke failed)');

  # ────────────────────────────────────────────────────────
  # PR Gate  (pull_request only) — single required status check
  # Set this ("PR Gate") as the required check in branch protection so the Test
  # stage (and lint/typecheck/build) hard-block merges to main.
  # ────────────────────────────────────────────────────────
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Assert all PR checks passed
        run: |
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Test:       ${{ needs.test.result }}"
          echo "Build:      ${{ needs.build.result }}"
          if [[ "${{ needs.lint.result }}"      != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.test.result }}"      != "success" ||
                "${{ needs.build.result }}"     != "success" ]]; then
            echo "PR Gate FAILED — lint, type check, test, and build must all pass."
            exit 1
          fi
          echo "PR Gate PASSED — all required checks green."

  # ────────────────────────────────────────────────────────
  # Final — Summary  (always runs)
  # ────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, docker, deploy, deploy-fleet, schema-diff, migrate, smoke-test, invalidate-cdn, finalize-deploy, pr-gate]
    if: always()
    steps:
      - name: Result
        run: |
          IS_MAIN="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

          echo "╔══════════════════════════════════════════╗"
          echo "║          PIPELINE SUMMARY                ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Lint:               ${{ needs.lint.result }}"
          echo "║  Type Check:         ${{ needs.typecheck.result }}"
          echo "║  Test & Coverage:    ${{ needs.test.result }}"
          echo "║  Build:              ${{ needs.build.result }}"
          if [[ "$IS_MAIN" == "true" ]]; then
          echo "║  Docker Push:        ${{ needs.docker.result }}"
          echo "║  Deploy to EC2:      ${{ needs.deploy.result }}"
          echo "║  Deploy tenant fleet:${{ needs.deploy-fleet.result }}"
          echo "║  Schema Diff:        ${{ needs.schema-diff.result }}"
          echo "║  Run DB Migrations:  ${{ needs.migrate.result }}"
          echo "║  Smoke Test:         ${{ needs.smoke-test.result }}"
          echo "║  Invalidate CDN:     ${{ needs.invalidate-cdn.result }}"
          echo "║  Finalize Deploy:    ${{ needs.finalize-deploy.result }}"
          fi
          echo "╠══════════════════════════════════════════╣"
          echo "║  Trigger: ${{ github.event_name }} → ${{ github.ref_name }}"
          echo "║  Commit:  ${{ github.sha }}"
          echo "║  Author:  ${{ github.actor }}"
          echo "╚══════════════════════════════════════════╝"

          if [[ "${{ needs.lint.result }}"      == "failure" ||
                "${{ needs.typecheck.result }}" == "failure" ||
                "${{ needs.test.result }}"      == "failure" ||
                "${{ needs.build.result }}"     == "failure" ]]; then
            echo "PIPELINE FAILED at checks stage."
            exit 1
          fi

          if [[ "$IS_MAIN" == "true" ]]; then
            if [[ "${{ needs.docker.result }}"         == "failure" ||
                  "${{ needs.deploy.result }}"         == "failure" ||
                  "${{ needs.deploy-fleet.result }}"   == "failure" ||
                  "${{ needs.schema-diff.result }}"    == "failure" ||
                  "${{ needs.migrate.result }}"        == "failure" ||
                  "${{ needs.smoke-test.result }}"     == "failure" ||
                  "${{ needs.invalidate-cdn.result }}" == "failure" ||
                  "${{ needs.finalize-deploy.result }}" == "failure" ]]; then
              echo "PIPELINE FAILED at deployment stage."
              exit 1
            fi
            echo "DEPLOYMENT SUCCESSFUL"
          else
            if [[ "${{ needs.pr-gate.result }}" != "success" ]]; then
              echo "PR GATE FAILED — not ready to merge."
              exit 1
            fi
            echo "PR CHECKS PASSED — ready to merge"
          fi
