name: Jeffi Stores Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────
  # Stage 0 — Detect migration files  (PR + main)
  # ────────────────────────────────────────────────────────
  check-migrations:
    name: Check for Migration Files
    runs-on: ubuntu-latest
    outputs:
      has_migrations: ${{ steps.detect.outputs.has_migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new migration files
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'database/migrations/*.sql' 2>/dev/null || echo "")
          if [[ -n "$CHANGED" ]]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "Migration files changed:"
            echo "$CHANGED"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No migration files changed — skipping migrate job"
          fi

  # ────────────────────────────────────────────────────────
  # Stage 1 — Lint  (PR + main)
  # ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────
  # Stage 1 — Type Check  (PR + main, parallel with lint)
  # ────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────────────
  # Stage 2 — Build  (PR + main, gate: lint + typecheck)
  # ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 3 — Docker build & push  (main only, gate: build)
  # ────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://localhost:5432/dummy
            JWT_SECRET=ci-build-secret
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            SKIP_DB_CHECK=true
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_ENABLE_RAZORPAY=${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
            NEXT_PUBLIC_ENABLE_GST=${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 4 — Deploy to EC2  (main only, gate: docker)
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'EC2 rolling deploy to jeffistores.in',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            return dep.data.id;

      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Rolling deploy (zero downtime)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/jeffi-stores

            echo "── Pulling latest code ──"
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "── Pulling new Docker image ──"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest

            echo "── Rolling restart app (nginx + redis stay up) ──"
            docker compose -f docker-compose.prod.yml stop app 2>/dev/null || true
            docker compose -f docker-compose.prod.yml rm -f app 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never --force-recreate app

            echo "── Waiting for app healthcheck to pass ──"
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost/api/health || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [[ "$STATUS" == "200" ]]; then
                echo "App is healthy."
                break
              fi
              if [[ $i -eq 18 ]]; then
                echo "App failed to become healthy after 3 minutes — rolling back."
                docker compose -f docker-compose.prod.yml up -d --no-deps app
                exit 1
              fi
              sleep 10
            done

            echo "── Pruning old images ──"
            docker image prune -f

            echo "── Status ──"
            docker compose -f docker-compose.prod.yml ps

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Deployed to EC2 successfully',
            });

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'EC2 deploy failed — check logs',
            });

  # ────────────────────────────────────────────────────────
  # Stage 5 — DB migrations  (main only, gate: deploy + new .sql files)
  # ────────────────────────────────────────────────────────
  migrate:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: [deploy, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.has_migrations == 'true'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Run migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/jeffi-stores
            docker compose -f docker-compose.prod.yml exec -T app node -e "
              const { Pool } = require('pg');
              const fs = require('fs');
              const path = require('path');
              const connStr = process.env.DATABASE_URL;
              const config = { connectionString: connStr };
              if (connStr && connStr.includes('rds.amazonaws.com')) {
                const certPath = path.join(process.cwd(), 'certs', 'global-bundle.pem');
                if (fs.existsSync(certPath)) {
                  config.ssl = { rejectUnauthorized: true, ca: fs.readFileSync(certPath).toString() };
                } else {
                  config.ssl = { rejectUnauthorized: false };
                }
              }
              const pool = new Pool(config);
              (async () => {
                await pool.query(\`
                  CREATE TABLE IF NOT EXISTS schema_migrations (
                    filename TEXT PRIMARY KEY,
                    applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
                  )
                \`);
                const dir = '/app/database/migrations';
                const files = fs.readdirSync(dir).filter(f => f.endsWith('.sql')).sort();
                const { rows: applied } = await pool.query('SELECT filename FROM schema_migrations');
                const appliedSet = new Set(applied.map(r => r.filename));
                let ran = 0;
                for (const file of files) {
                  if (appliedSet.has(file)) {
                    process.stdout.write('Skipping ' + file + ' (already applied)\n');
                    continue;
                  }
                  const sql = fs.readFileSync(path.join(dir, file), 'utf8').trim();
                  if (sql) {
                    process.stdout.write('Running ' + file + '...');
                    await pool.query(sql);
                    await pool.query('INSERT INTO schema_migrations (filename) VALUES (\$1)', [file]);
                    process.stdout.write(' done\n');
                    ran++;
                  }
                }
                if (ran === 0) process.stdout.write('No new migration files to apply.\n');
                await pool.end();
              })().catch(e => { process.stderr.write(e.message + '\n'); process.exit(1); });
            "

  # ────────────────────────────────────────────────────────
  # Stage 6 — Smoke test  (main only, gate: deploy)
  # ────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for app to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://${{ steps.ec2.outputs.host }} || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" ]]; then
              echo "App is up."
              exit 0
            fi
            sleep 10
          done
          echo "App did not respond after 2 minutes."
          exit 1

  # ────────────────────────────────────────────────────────
  # Stage 7 — Invalidate CDN  (main only, gate: smoke-test + migrate)
  # ────────────────────────────────────────────────────────
  invalidate-cdn:
    name: Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: [smoke-test, migrate]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.smoke-test.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - name: Invalidate cache
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: "/*"
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ────────────────────────────────────────────────────────
  # Final — Summary  (always runs)
  # ────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, docker, deploy, migrate, smoke-test, invalidate-cdn]
    if: always()
    steps:
      - name: Result
        run: |
          IS_MAIN="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

          echo "╔══════════════════════════════════════════╗"
          echo "║          PIPELINE SUMMARY                ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Lint:               ${{ needs.lint.result }}"
          echo "║  Type Check:         ${{ needs.typecheck.result }}"
          echo "║  Build:              ${{ needs.build.result }}"
          if [[ "$IS_MAIN" == "true" ]]; then
          echo "║  Docker Push:        ${{ needs.docker.result }}"
          echo "║  Deploy to EC2:      ${{ needs.deploy.result }}"
          echo "║  DB Migrations:      ${{ needs.migrate.result }}"
          echo "║  Smoke Test:         ${{ needs.smoke-test.result }}"
          echo "║  Invalidate CDN:     ${{ needs.invalidate-cdn.result }}"
          fi
          echo "╠══════════════════════════════════════════╣"
          echo "║  Trigger: ${{ github.event_name }} → ${{ github.ref_name }}"
          echo "║  Commit:  ${{ github.sha }}"
          echo "║  Author:  ${{ github.actor }}"
          echo "╚══════════════════════════════════════════╝"

          if [[ "${{ needs.lint.result }}"      == "failure" ||
                "${{ needs.typecheck.result }}" == "failure" ||
                "${{ needs.build.result }}"     == "failure" ]]; then
            echo "PIPELINE FAILED at checks stage."
            exit 1
          fi

          if [[ "$IS_MAIN" == "true" ]]; then
            if [[ "${{ needs.docker.result }}"       == "failure" ||
                  "${{ needs.deploy.result }}"       == "failure" ||
                  "${{ needs.migrate.result }}"      == "failure" ||
                  "${{ needs.smoke-test.result }}"   == "failure" ||
                  "${{ needs.invalidate-cdn.result }}" == "failure" ]]; then
              echo "PIPELINE FAILED at deployment stage."
              exit 1
            fi
            echo "DEPLOYMENT SUCCESSFUL"
          else
            echo "PR CHECKS PASSED — ready to merge"
          fi
