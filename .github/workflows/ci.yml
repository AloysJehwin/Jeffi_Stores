name: Jeffi Stores Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────
  # Stage 0 — Detect migration files  (PR + main)
  # ────────────────────────────────────────────────────────
  check-migrations:
    name: Check for Migration Files
    runs-on: ubuntu-latest
    outputs:
      has_migrations: ${{ steps.detect.outputs.has_migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect migration trigger in commit message
        id: detect
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qiE '\[migrate\]|run-migrations'; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "Migration trigger found in commit message — will run migrations"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No migration trigger in commit message — skipping migrate job"
            echo "(Add '[migrate]' to your commit message to trigger migrations)"
          fi

  # ────────────────────────────────────────────────────────
  # Stage 1 — Lint  (PR + main)
  # ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────
  # Stage 1 — Type Check  (PR + main, parallel with lint)
  # ────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────────────
  # Stage 2 — Test + Coverage  (PR + main, gate: lint + typecheck)
  # ────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run tests with coverage
        run: npx vitest run --coverage --pool=forks
        env:
          JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
          CRON_SECRET: test-cron-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
          RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
          DELHIVERY_API_KEY: test-delhivery-key
          GOOGLE_CLIENT_ID: test-google-client-id

  # ────────────────────────────────────────────────────────
  # Stage 3 — Build  (PR + main, gate: test)
  # ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 3 — Docker build & push  (main only, gate: build)
  # ────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://localhost:5432/dummy
            JWT_SECRET=ci-build-secret
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            SKIP_DB_CHECK=true
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_ENABLE_RAZORPAY=${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
            NEXT_PUBLIC_ENABLE_GST=${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 4 — Deploy to EC2  (main only, gate: docker)
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'EC2 rolling deploy to jeffistores.in',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            return dep.data.id;

      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Rolling deploy (zero downtime)
        uses: appleboy/ssh-action@v1
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: GH_DEPLOY_TOKEN,GH_REPOSITORY,GH_ACTOR
          script: |
            set -e
            cd /opt/jeffi-stores

            echo "── Pulling latest code ──"
            git config credential.helper '!f(){ echo "username=x-token"; echo "password=$GH_DEPLOY_TOKEN"; };f'
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "── Pulling new Docker image ──"
            echo "$GH_DEPLOY_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker pull ghcr.io/$(echo "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]'):latest

            echo "── Rolling restart app (nginx + redis stay up) ──"
            docker compose -f docker-compose.prod.yml stop app 2>/dev/null || true
            docker compose -f docker-compose.prod.yml rm -f app 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never --force-recreate app

            echo "── Waiting for app healthcheck to pass ──"
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost/api/health || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [[ "$STATUS" == "200" ]]; then
                echo "App is healthy."
                break
              fi
              if [[ $i -eq 18 ]]; then
                echo "App failed to become healthy after 3 minutes — rolling back."
                docker compose -f docker-compose.prod.yml up -d --no-deps app
                exit 1
              fi
              sleep 10
            done

            echo "── Pruning old images ──"
            docker image prune -f

            echo "── Status ──"
            docker compose -f docker-compose.prod.yml ps

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Deployed to EC2 successfully',
            });

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'EC2 deploy failed — check logs',
            });

  # ────────────────────────────────────────────────────────
  # Stage 5 — DB migrations  (main only, gate: deploy + new .sql files)
  # ────────────────────────────────────────────────────────
  migrate:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: [deploy, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.has_migrations == 'true'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Run migrations
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            set -euo pipefail
            cd /opt/jeffi-stores

            if ! command -v psql >/dev/null 2>&1; then
              echo "Installing postgresql client..."
              sudo dnf install -y postgresql15 || sudo yum install -y postgresql
            fi

            # RDS uses IAM auth with static AWS keys; app_user has rds_superuser for DDL
            export PGHOST=jeffi-stores-db.cjmaa6acimgm.us-east-1.rds.amazonaws.com
            export PGPORT=5432
            export PGUSER=app_user
            export PGDATABASE=jeffi_stores
            export PGPASSWORD=$(aws rds generate-db-auth-token \
              --hostname "$PGHOST" --port "$PGPORT" \
              --region us-east-1 --username "$PGUSER")
            export PGSSLMODE=require

            echo "Verifying DB connectivity..."
            psql -tAc 'SELECT 1' >/dev/null

            echo "── Ensuring schema_migrations table ──"
            psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now())"

            MIGRATION_ORDER=(
              add_brand_return_policy.sql
              add_buyer_fields_to_quotations.sql
              add_cart_items_saved_for_later.sql
              add_category_return_policy.sql
              add_category_policy_inheritance.sql
              add_consignee_email_to_quotations.sql
              add_crm_and_search_logs.sql
              add_customer_activity_and_tasks.sql
              add_customer_health.sql
              add_auto_tasks.sql
              add_customer_tag_definitions.sql
              add_delivery_settings.sql
              add_email_campaigns.sql
              add_image_thumbnail_urls_to_product_reviews.sql
              add_image_urls_to_product_reviews.sql
              add_inventory_quantity_to_sub_variants.sql
              add_merchant_sync_log.sql
              add_mfa_to_admins.sql
              add_sub_variant_id_to_cart_items.sql
              add_template_type_to_review_forms.sql
              add_variant_images_and_sub_variants.sql
              add_view_tokens.sql
              normalize_phone_numbers.sql
              rename_products_price_fields.sql
              rename_sale_price_add_ex_gst.sql
              reseed_campaign_templates.sql
              reseed_campaign_templates_with_images.sql
              add_ai_assistant_log.sql
              add_scenarios_to_campaigns.sql
              add_custom_scenarios.sql
              add_custom_scenario_product_sql.sql
              add_ai_feedback.sql
              add_recommended_product_ids_to_ai_queries.sql
              add_ai_briefing_log.sql
              add_admin_agent.sql
              add_product_ai_enrichment.sql
              add_product_ai_enrichment_v2.sql
              add_admin_agent_proposed_tools.sql
              add_admin_audit_log.sql
              add_admin_agent_attachments.sql
              add_sub_variant_id_to_order_items.sql
              add_user_avatar.sql
              add_user_search_history.sql
              add_business_partner_tables.sql
              add_requested_price_to_rfq_items.sql
              add_sub_variant_to_rfq_items.sql
              add_sale_id_to_invoices.sql
              add_status_to_cash_sales.sql
              add_sub_variant_id_to_inventory_transactions.sql
              add_ui_blocks_to_agent_messages.sql
              allow_same_email_multi_user_type.sql
              add_discount_pct_to_products.sql
              add_payment_mode_to_orders.sql
              add_qr_fields_to_orders.sql
              extend_email_logs_for_audit.sql
              add_replication_runs.sql
              add_product_units_phase1.sql
              cascade_shelf_stock_on_variant_delete.sql
              cascade_variant_fk_history_tables.sql
              add_dimension_to_product_units.sql
              product_level_units.sql
              drop_legacy_weight_length_columns.sql
              add_sub_variant_id_to_product_units.sql
              add_sell_unit_id_drop_is_sell_default.sql
              add_unit_columns_to_inventory_transactions.sql
              add_fractional_inventory.sql
              add_default_pc_unit.sql
              add_po_conversion.sql
              drop_wholeprice_ex_gst.sql
              drop_site_settings_audit.sql
              fix_cart_items_unique_constraint.sql
              stock_quantity_to_status_enum.sql
              create_rfq_messages.sql
              add_mrp_to_order_items.sql
              add_back_in_stock_notify.sql
              add_buy_unit_to_sale_tables.sql
              add_buy_unit_to_quotation_items.sql
              add_campaign_send_counts.sql
              add_category_hero_images.sql
              add_status_to_invoices.sql
              add_user_policy_acceptance.sql
              add_business_discount_amount_to_orders.sql
              backfill_order_items_mrp_from_quotation.sql
              backfill_variant_sell_unit_id.sql
              add_service_accounts.sql
            )

            APPLIED=$(psql -tAc "SELECT filename FROM schema_migrations" | tr -d ' ')

            ran=0
            skipped=0
            missing=0
            for file in "${MIGRATION_ORDER[@]}"; do
              fp="database/migrations/$file"
              if ! [[ -f "$fp" ]]; then
                echo "  ! missing $file (will skip)"
                missing=$((missing+1))
                continue
              fi
              if echo "$APPLIED" | grep -qx "$file"; then
                echo "  - skip   $file"
                skipped=$((skipped+1))
                continue
              fi
              echo "  + apply  $file"
              psql -v ON_ERROR_STOP=1 -1 -f "$fp"
              psql -v ON_ERROR_STOP=1 -c \
                "INSERT INTO schema_migrations (filename) VALUES ('$file') ON CONFLICT DO NOTHING"
              ran=$((ran+1))
            done

            echo ""
            echo "── Migration summary ──"
            echo "  Applied:  $ran"
            echo "  Skipped:  $skipped (already applied)"
            echo "  Missing:  $missing (file not in repo)"

  # ────────────────────────────────────────────────────────
  # Stage 6 — Smoke test  (main only, gate: deploy)
  # ────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for app to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://${{ steps.ec2.outputs.host }} || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" ]]; then
              echo "App is up."
              exit 0
            fi
            sleep 10
          done
          echo "App did not respond after 2 minutes."
          exit 1

  # ────────────────────────────────────────────────────────
  # Stage 7 — Invalidate CDN  (main only, gate: deploy)
  # Runs as soon as the new image is live so cached 30x/HTML at the edge
  # gets cleared before the smoke test, not after. Also waits for the
  # invalidation to complete so the next stage sees a clean cache.
  # ────────────────────────────────────────────────────────
  invalidate-cdn:
    name: Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create invalidation and wait
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INV_ID created — waiting for completion..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INV_ID"
          echo "Invalidation $INV_ID complete."

  # ────────────────────────────────────────────────────────
  # Final — Summary  (always runs)
  # ────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, docker, deploy, migrate, smoke-test, invalidate-cdn]
    if: always()
    steps:
      - name: Result
        run: |
          IS_MAIN="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

          echo "╔══════════════════════════════════════════╗"
          echo "║          PIPELINE SUMMARY                ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Lint:               ${{ needs.lint.result }}"
          echo "║  Type Check:         ${{ needs.typecheck.result }}"
          echo "║  Test & Coverage:    ${{ needs.test.result }}"
          echo "║  Build:              ${{ needs.build.result }}"
          if [[ "$IS_MAIN" == "true" ]]; then
          echo "║  Docker Push:        ${{ needs.docker.result }}"
          echo "║  Deploy to EC2:      ${{ needs.deploy.result }}"
          echo "║  DB Migrations:      ${{ needs.migrate.result }}"
          echo "║  Smoke Test:         ${{ needs.smoke-test.result }}"
          echo "║  Invalidate CDN:     ${{ needs.invalidate-cdn.result }}"
          fi
          echo "╠══════════════════════════════════════════╣"
          echo "║  Trigger: ${{ github.event_name }} → ${{ github.ref_name }}"
          echo "║  Commit:  ${{ github.sha }}"
          echo "║  Author:  ${{ github.actor }}"
          echo "╚══════════════════════════════════════════╝"

          if [[ "${{ needs.lint.result }}"      == "failure" ||
                "${{ needs.typecheck.result }}" == "failure" ||
                "${{ needs.test.result }}"      == "failure" ||
                "${{ needs.build.result }}"     == "failure" ]]; then
            echo "PIPELINE FAILED at checks stage."
            exit 1
          fi

          if [[ "$IS_MAIN" == "true" ]]; then
            if [[ "${{ needs.docker.result }}"       == "failure" ||
                  "${{ needs.deploy.result }}"       == "failure" ||
                  "${{ needs.migrate.result }}"      == "failure" ||
                  "${{ needs.smoke-test.result }}"   == "failure" ||
                  "${{ needs.invalidate-cdn.result }}" == "failure" ]]; then
              echo "PIPELINE FAILED at deployment stage."
              exit 1
            fi
            echo "DEPLOYMENT SUCCESSFUL"
          else
            echo "PR CHECKS PASSED — ready to merge"
          fi
