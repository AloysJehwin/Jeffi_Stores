name: Jeffi Stores Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────
  # Stage 0 — Detect schema file changes  (main push only)
  # ────────────────────────────────────────────────────────
  check-schema:
    name: Check for Schema Changes
    runs-on: ubuntu-latest
    outputs:
      schema_changed: ${{ steps.detect.outputs.schema_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect schema file changes
        id: detect
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^database/.*\.sql'; then
            echo "schema_changed=true" >> $GITHUB_OUTPUT
            echo "Schema files changed — will apply to RDS"
          else
            echo "schema_changed=false" >> $GITHUB_OUTPUT
            echo "No schema files changed — skipping schema-apply job"
          fi

  # ────────────────────────────────────────────────────────
  # Stage 1 — Lint  (PR + main)
  # ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────
  # Stage 1 — Type Check  (PR + main, parallel with lint)
  # ────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────────────
  # Stage 2 — Test + Coverage  (PR + main, gate: lint + typecheck)
  # ────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run tests with coverage
        run: npx vitest run --coverage --pool=forks
        env:
          JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
          CRON_SECRET: test-cron-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
          RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
          DELHIVERY_API_KEY: test-delhivery-key
          GOOGLE_CLIENT_ID: test-google-client-id

  # ────────────────────────────────────────────────────────
  # Stage 3 — Build  (PR + main, gate: test)
  # ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 3 — Docker build & push  (main only, gate: build)
  # ────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://localhost:5432/dummy
            JWT_SECRET=ci-build-secret
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            SKIP_DB_CHECK=true
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_ENABLE_RAZORPAY=${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
            NEXT_PUBLIC_ENABLE_GST=${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ────────────────────────────────────────────────────────
  # Stage 4 — Deploy to EC2  (main only, gate: docker)
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'EC2 rolling deploy to jeffistores.in',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            return dep.data.id;

      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Rolling deploy (zero downtime)
        uses: appleboy/ssh-action@v1
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: GH_DEPLOY_TOKEN,GH_REPOSITORY,GH_ACTOR
          script: |
            set -e
            cd /opt/jeffi-stores

            echo "── Pulling latest code ──"
            git config credential.helper '!f(){ echo "username=x-token"; echo "password=$GH_DEPLOY_TOKEN"; };f'
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "── Pulling new Docker image ──"
            echo "$GH_DEPLOY_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker pull ghcr.io/$(echo "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]'):latest

            echo "── Rolling restart app (nginx + redis stay up) ──"
            docker compose -f docker-compose.prod.yml stop app 2>/dev/null || true
            docker compose -f docker-compose.prod.yml rm -f app 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never --force-recreate app

            echo "── Waiting for app healthcheck to pass ──"
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost/api/health || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [[ "$STATUS" == "200" ]]; then
                echo "App is healthy."
                break
              fi
              if [[ $i -eq 18 ]]; then
                echo "App failed to become healthy after 3 minutes — rolling back."
                docker compose -f docker-compose.prod.yml up -d --no-deps app
                exit 1
              fi
              sleep 10
            done

            echo "── Pruning old images ──"
            docker image prune -f

            echo "── Reloading nginx config ──"
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t && \
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || \
              echo "nginx reload skipped (container may not be named nginx)"

            echo "── Status ──"
            docker compose -f docker-compose.prod.yml ps

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://jeffistores.in',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Deployed to EC2 successfully',
            });

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.result }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'EC2 deploy failed — check logs',
            });

  # ────────────────────────────────────────────────────────
  # Stage 5 — Apply DB Schema  (main only, gate: deploy + schema changed)
  # ────────────────────────────────────────────────────────
  schema-apply:
    name: Apply DB Schema
    runs-on: ubuntu-latest
    needs: [deploy, check-schema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-schema.outputs.schema_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Apply schema to RDS via EC2 tunnel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/jeffi-stores

            echo "Generating IAM auth token..."
            PGPASSWORD=$(aws rds generate-db-auth-token \
              --hostname jeffi-stores-db.cjmaa6acimgm.us-east-1.rds.amazonaws.com \
              --port 5432 \
              --region us-east-1 \
              --username app_user)
            export PGPASSWORD

            echo "Applying schema modules..."
            for f in database/extensions.sql database/users.sql database/catalog.sql \
                     database/inventory.sql database/orders.sql database/payments.sql \
                     database/quotations.sql database/invoices.sql database/marketing.sql \
                     database/reviews.sql database/crm.sql database/support.sql \
                     database/ai.sql database/logs.sql database/settings.sql \
                     database/indexes.sql database/functions.sql database/triggers.sql \
                     database/constraints.sql; do
              echo ">> $(basename "$f")"
              PGSSLMODE=require psql \
                -h jeffi-stores-db.cjmaa6acimgm.us-east-1.rds.amazonaws.com \
                -p 5432 -U app_user -d jeffi_stores \
                -v ON_ERROR_STOP=0 -f "$f"
            done
            echo "Schema apply complete."

  # ────────────────────────────────────────────────────────
  # Stage 6 — Smoke test  (main only, gate: deploy)
  # ────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Get EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "host=$IP" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for app to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://${{ steps.ec2.outputs.host }} || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" ]]; then
              echo "App is up."
              exit 0
            fi
            sleep 10
          done
          echo "App did not respond after 2 minutes."
          exit 1

  # ────────────────────────────────────────────────────────
  # Stage 7 — Invalidate CDN  (main only, gate: deploy)
  # Runs as soon as the new image is live so cached 30x/HTML at the edge
  # gets cleared before the smoke test, not after. Also waits for the
  # invalidation to complete so the next stage sees a clean cache.
  # ────────────────────────────────────────────────────────
  invalidate-cdn:
    name: Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create invalidation and wait
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INV_ID created — waiting for completion..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INV_ID"
          echo "Invalidation $INV_ID complete."

  # ────────────────────────────────────────────────────────
  # Final — Summary  (always runs)
  # ────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, docker, deploy, schema-apply, smoke-test, invalidate-cdn]
    if: always()
    steps:
      - name: Result
        run: |
          IS_MAIN="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

          echo "╔══════════════════════════════════════════╗"
          echo "║          PIPELINE SUMMARY                ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Lint:               ${{ needs.lint.result }}"
          echo "║  Type Check:         ${{ needs.typecheck.result }}"
          echo "║  Test & Coverage:    ${{ needs.test.result }}"
          echo "║  Build:              ${{ needs.build.result }}"
          if [[ "$IS_MAIN" == "true" ]]; then
          echo "║  Docker Push:        ${{ needs.docker.result }}"
          echo "║  Deploy to EC2:      ${{ needs.deploy.result }}"
          echo "║  Apply DB Schema:    ${{ needs.schema-apply.result }}"
          echo "║  Smoke Test:         ${{ needs.smoke-test.result }}"
          echo "║  Invalidate CDN:     ${{ needs.invalidate-cdn.result }}"
          fi
          echo "╠══════════════════════════════════════════╣"
          echo "║  Trigger: ${{ github.event_name }} → ${{ github.ref_name }}"
          echo "║  Commit:  ${{ github.sha }}"
          echo "║  Author:  ${{ github.actor }}"
          echo "╚══════════════════════════════════════════╝"

          if [[ "${{ needs.lint.result }}"      == "failure" ||
                "${{ needs.typecheck.result }}" == "failure" ||
                "${{ needs.test.result }}"      == "failure" ||
                "${{ needs.build.result }}"     == "failure" ]]; then
            echo "PIPELINE FAILED at checks stage."
            exit 1
          fi

          if [[ "$IS_MAIN" == "true" ]]; then
            if [[ "${{ needs.docker.result }}"         == "failure" ||
                  "${{ needs.deploy.result }}"         == "failure" ||
                  "${{ needs.schema-apply.result }}"   == "failure" ||
                  "${{ needs.smoke-test.result }}"     == "failure" ||
                  "${{ needs.invalidate-cdn.result }}" == "failure" ]]; then
              echo "PIPELINE FAILED at deployment stage."
              exit 1
            fi
            echo "DEPLOYMENT SUCCESSFUL"
          else
            echo "PR CHECKS PASSED — ready to merge"
          fi
