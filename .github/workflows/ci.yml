name: Jeffi Stores Pipeline

# PR: lint, typecheck, tests, build (pr-gate). Push to main: the same, then the four service images are built
# and pushed to ECR (tag local-<image_sha>, shared with a Mac release), and the deploy job waits on the
# `production` environment for approval. Approved, it opens an SSM tunnel to the core and, in order:
#   1. jeffi_stores schema (deploy/k8s/db/release-db.sh --schema: the additive database/*.sql diff, manual.sql,
#      the control-plane diff and plan seed) when the schema changed since the live commit;
#   2. pending database/migrations files (release-db.sh --migrations), every deploy: only files not yet in
#      schema_migrations run, so it is a no-op when nothing is pending;
#   3. the rollout (release.sh --rollout-only), which also fans the schema and migration files out to every
#      store tenant's own database (40-tenant-fanout.sh) once the new controller is up;
#   4. a CloudFront invalidation.
# A database step that fails stops the run before anything is rolled out.
# workflow_dispatch with deploy=true runs the release path from any branch; dry_run (on by default) builds the
# images, prints the SQL every database step would apply, checks the cluster and the tenant fan-out, and
# changes nothing in production.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Run the release path for this ref (pauses for approval)
        type: boolean
        default: false
      dry_run:
        description: Dry run — build images and show the database SQL, change nothing in production
        type: boolean
        default: true
      schema:
        description: Run the jeffi_stores schema step even if database/ is unchanged since the live commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  verify-scripts:
    name: Referenced scripts exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script a workflow runs is committed
        run: |
          set -euo pipefail
          missing=0
          for f in $(grep -ohE '(\.github/scripts|deploy)/[A-Za-z0-9_./-]+\.sh' .github/workflows/*.yml | sort -u); do
            [ -f "$f" ] || { echo "::error::$f is referenced by a workflow but not committed"; missing=1; }
          done
          exit $missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Controller
        run: npx tsc --noEmit
      - name: Services and packages
        run: npm run typecheck:services

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      RAZORPAYX_WEBHOOK_SECRET: test-razorpayx-secret
      DELHIVERY_API_KEY: test-delhivery-key
      GOOGLE_CLIENT_ID: test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Controller tests with coverage
        run: npx vitest run --coverage --pool=forks
      - name: Integration / UI tests
        run: npm run test:integration
      - name: Service tests
        run: |
          npm --prefix messaging-service test
          npm --prefix document-service test
          npm --prefix public-api-service test -- --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Next.js build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DATABASE_URL: postgresql://localhost:5432/dummy
          JWT_SECRET: ci-test-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_DB_CHECK: true
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_ENABLE_RAZORPAY: ${{ secrets.NEXT_PUBLIC_ENABLE_RAZORPAY }}
          NEXT_PUBLIC_ENABLE_GST: ${{ secrets.NEXT_PUBLIC_ENABLE_GST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [verify-scripts, lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - run: |
          echo "Scripts:    ${{ needs.verify-scripts.result }}"
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Test:       ${{ needs.test.result }}"
          echo "Build:      ${{ needs.build.result }}"
          [[ "${{ needs.verify-scripts.result }}${{ needs.lint.result }}${{ needs.typecheck.result }}${{ needs.test.result }}${{ needs.build.result }}" == "successsuccesssuccesssuccesssuccess" ]] ||
            { echo "PR Gate FAILED"; exit 1; }
          echo "PR Gate PASSED"

  # ── Release (push to main, or workflow_dispatch with deploy=true) ─────────────────────────────────────

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    needs: [verify-scripts, lint, typecheck, test, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: [controller, messaging, documents, public-api]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # image_sha is the last commit that changed the image contents
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3 # exposes the cache endpoint buildx's gha cache needs
      - id: tag
        run: echo "tag=$(bash deploy/k8s/bootstrap/image-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Build and push (skipped when the tag already exists)
        env:
          BUILDX_CACHE_ARGS: --cache-from type=gha,scope=${{ matrix.service }} --cache-to type=gha,mode=max,scope=${{ matrix.service }}
          NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY: ${{ vars.NEXT_PUBLIC_ENABLE_ONDEVICE_SUMMARY }}
          NEXT_PUBLIC_ONDEVICE_MODEL_BASE: ${{ vars.NEXT_PUBLIC_ONDEVICE_MODEL_BASE }}
        run: bash deploy/k8s/bootstrap/build-push-ecr.sh "${{ matrix.service }}" "${{ steps.tag.outputs.tag }}"

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    needs: [verify-scripts, lint, typecheck, test, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    outputs:
      schema: ${{ steps.notes.outputs.schema }}
      migrations: ${{ steps.notes.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: notes
        name: What this release changes
        run: |
          set -euo pipefail
          tag=$(bash deploy/k8s/bootstrap/image-tag.sh)
          live=$(curl -fsS --max-time 15 https://jeffistores.in/api/health | sed -nE 's/.*"commit":"([0-9a-f]+)".*/\1/p' || true)
          {
            echo "## Release $tag (HEAD ${GITHUB_SHA::8})"; echo
            if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              schema=$(git diff --name-only "$live..HEAD" -- database deploy/schema-diff.sh deploy/k8s/db/manual.sql ':(exclude)database/migrations')
              migrations=$(git diff --name-only "$live..HEAD" -- database/migrations)
              echo "Live: \`$live\`. Commits since:"; echo
              git log --format='- %h %s' "$live..HEAD" | head -60
            else
              # Unknown live commit: run both steps (each is idempotent and applies only what is missing).
              schema="(live commit ${live:-unknown} not in this clone)"; migrations=$schema
              echo "Live commit \`${live:-unknown}\` is not in this clone; the database steps will run in full."
            fi
            echo
            if [ -n "$schema" ]; then echo "**Schema:** the deploy job applies the \`database/\` diff to jeffi_stores first:"; echo "$schema" | sed 's/^/- /'; else echo "**Schema:** unchanged."; fi
            echo
            if [ -n "$migrations" ]; then echo "**Migrations:** new \`database/migrations\` files:"; echo "$migrations" | sed 's/^/- /'; else echo "**Migrations:** no new files; the deploy job still runs any not yet recorded."; fi
            echo; echo "Store tenant databases are updated during the rollout. Approve the \`production\` environment to proceed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "schema=$([ -n "$schema" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "migrations=$([ -n "$migrations" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Production: one approval (the `production` environment), then each stage is its own job in the
  # `production-release` environment (no reviewer, same branches) so the graph shows where a release stands.
  approve:
    name: Approve release
    runs-on: ubuntu-latest
    needs: [images, release-notes]
    environment:
      name: production
      url: https://jeffistores.in
    steps:
      - run: echo "Approved ${{ needs.images.outputs.tag }}, dry_run=${{ env.DRY }}"

  db-schema:
    name: Database · schema
    runs-on: ubuntu-latest
    needs: [images, release-notes, approve]
    if: ${{ !failure() && !cancelled() && needs.approve.result == 'success' && (needs.release-notes.outputs.schema == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.schema))) }}
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: jeffi_stores schema diff, manual.sql, control-plane diff and plan seed
        run: bash deploy/k8s/db/release-db.sh --schema --yes ${{ env.DRY == 'true' && '--dry-run' || '' }}
      - name: SQL (summary)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$OUT_DIR"/applied-schema-platform.sql "$OUT_DIR"/schema-*.sql; do
            [ -s "$f" ] || continue
            { echo "<details><summary>$(basename "$f") ($(grep -c ';' "$f") statements)</summary>"; echo; echo '```sql'; head -c 60000 "$f"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-${{ github.job }}
          path: ${{ runner.temp }}/db
          if-no-files-found: ignore

  db-migrations:
    name: Database · migrations
    runs-on: ubuntu-latest
    needs: [images, approve, db-schema]
    if: ${{ !failure() && !cancelled() && needs.approve.result == 'success' }}
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Pending database/migrations files
        run: bash deploy/k8s/db/release-db.sh --migrations --yes ${{ env.DRY == 'true' && '--dry-run' || '' }}
      - name: SQL (summary)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$OUT_DIR"/applied-schema-platform.sql "$OUT_DIR"/schema-*.sql; do
            [ -s "$f" ] || continue
            { echo "<details><summary>$(basename "$f") ($(grep -c ';' "$f") statements)</summary>"; echo; echo '```sql'; head -c 60000 "$f"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-${{ github.job }}
          path: ${{ runner.temp }}/db
          if-no-files-found: ignore

  rollout-platform:
    name: Roll out · platform
    runs-on: ubuntu-latest
    needs: [images, db-migrations]
    if: success()
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Controller, messaging, documents, public-api and CronJobs at ${{ needs.images.outputs.tag }}
        run: bash deploy/k8s/bootstrap/rollout.sh ${{ needs.images.outputs.tag }} platform ${{ env.DRY == 'true' && '--dry-run' || '' }}

  db-tenants:
    name: Database · tenants
    runs-on: ubuntu-latest
    needs: [images, rollout-platform]
    if: success()
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Schema and migration files to every store's database
        run: bash deploy/k8s/bootstrap/rollout.sh ${{ needs.images.outputs.tag }} tenant-db ${{ env.DRY == 'true' && '--dry-run' || '' }}

  rollout-stores:
    name: Roll out · stores
    runs-on: ubuntu-latest
    needs: [images, db-tenants]
    if: success()
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Every store's controller, messaging and document pods at ${{ needs.images.outputs.tag }}
        run: bash deploy/k8s/bootstrap/rollout.sh ${{ needs.images.outputs.tag }} stores ${{ env.DRY == 'true' && '--dry-run' || '' }}

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [images, rollout-stores]
    if: success()
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Invalidate CloudFront
        if: env.DRY != 'true'
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$id"
          echo "Invalidation $id complete"
      - name: Smoke test (live commit and every host)
        run: |
          tag=${{ needs.images.outputs.tag }}
          bash deploy/k8s/bootstrap/smoke.sh "${tag#local-}" ${{ env.DRY == 'true' && '--dry-run' || '' }}

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [verify-scripts, lint, typecheck, test, build, pr-gate, images, release-notes, approve, db-schema, db-migrations, rollout-platform, db-tenants, rollout-stores, verify]
    if: always()
    steps:
      - run: |
          echo "Scripts:        ${{ needs.verify-scripts.result }}"
          echo "Lint:           ${{ needs.lint.result }}"
          echo "Type Check:     ${{ needs.typecheck.result }}"
          echo "Test:           ${{ needs.test.result }}"
          echo "Build:          ${{ needs.build.result }}"
          echo "PR Gate:        ${{ needs.pr-gate.result }}"
          echo "Images:         ${{ needs.images.result }}"
          echo "Release notes:  ${{ needs.release-notes.result }}"
          echo "Approve:        ${{ needs.approve.result }}"
          echo "DB schema:      ${{ needs.db-schema.result }}"
          echo "DB migrations:  ${{ needs.db-migrations.result }}"
          echo "Platform:       ${{ needs.rollout-platform.result }}"
          echo "DB tenants:     ${{ needs.db-tenants.result }}"
          echo "Stores:         ${{ needs.rollout-stores.result }}"
          echo "Verify:         ${{ needs.verify.result }}"
          case "${{ needs.verify-scripts.result }} ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.pr-gate.result }} ${{ needs.images.result }} ${{ needs.release-notes.result }} ${{ needs.approve.result }} ${{ needs.db-schema.result }} ${{ needs.db-migrations.result }} ${{ needs.rollout-platform.result }} ${{ needs.db-tenants.result }} ${{ needs.rollout-stores.result }} ${{ needs.verify.result }}" in
            *failure*|*cancelled*) echo "Pipeline FAILED"; exit 1 ;;
          esac
          echo "Pipeline OK"
