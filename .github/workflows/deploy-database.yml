name: Database

# The platform database (jeffi_stores) for a release, in order: schema diff, then pending migration
# files. Both alter jeffi_stores, so they never overlap. Store databases follow the platform rollout
# (deploy-stores.yml), since they need the new controller.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to deploy (the one the checks ran on)
        type: string
        required: true
      run-schema:
        description: Apply the schema diff (database/ changed, or forced)
        type: boolean
        required: true
      dry-run:
        type: boolean
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  schema:
    name: Schema
    runs-on: ubuntu-latest
    if: inputs.run-schema
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: jeffi_stores schema diff, manual.sql, control-plane diff and plan seed
        run: bash deploy/k8s/db/release-db.sh --schema --yes ${{ inputs.dry-run && '--dry-run' || '' }}
      - if: always()
        uses: ./.github/actions/db-report

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: schema
    if: ${{ !failure() && !cancelled() }}
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Pending database/migrations files
        run: bash deploy/k8s/db/release-db.sh --migrations --yes ${{ inputs.dry-run && '--dry-run' || '' }}
      - if: always()
        uses: ./.github/actions/db-report
