name: Service checks

# One service's checks as their own nodes (Lint, Type check, Tests) feeding its Passed node, so
# each app gets its own lane in the graph. Called from ci.yml once per service.

on:
  workflow_call:
    inputs:
      lint-paths:
        description: Paths ESLint checks (.eslintrc.services.cjs)
        type: string
        required: true
      typecheck:
        description: Type-check command
        type: string
        required: true
      test:
        description: Test command
        type: string
        required: true
      install:
        description: Extra install command after the root npm ci (e.g. a nested package)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          install: ${{ inputs.install }}
      - run: npx eslint --no-eslintrc -c .eslintrc.services.cjs --ext .ts ${{ inputs.lint-paths }}

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          install: ${{ inputs.install }}
      - run: ${{ inputs.typecheck }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
      CRON_SECRET: test-cron-secret
      SERVICE_AUTH_SECRET: test-service-auth-secret
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          install: ${{ inputs.install }}
      - run: ${{ inputs.test }}

  passed:
    name: Passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: always()
    steps:
      - run: '[ "${{ needs.lint.result }}${{ needs.typecheck.result }}${{ needs.test.result }}" = successsuccesssuccess ] || { echo "::error::Lint ${{ needs.lint.result }}, Type check ${{ needs.typecheck.result }}, Tests ${{ needs.test.result }}"; exit 1; }'
