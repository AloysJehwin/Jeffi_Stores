name: Release

# Runs on every push to main. Release Please keeps ONE open release PR, updating
# it as commits land; merging that PR is what creates the tag. Nothing is pushed
# to main directly, so `enforce_admins` branch protection stays intact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created == 'true' && 'true' || (steps.recover.outputs.tag != '' && 'true' || 'false') }}
      tag: ${{ steps.release.outputs.tag_name || steps.recover.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.recover.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PR opened with the default GITHUB_TOKEN does NOT trigger CI, so the
          # required checks would never report and the PR could never merge.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Release Please finds the release commit by matching it against the tip of main. Merging
      # the release PR with a MERGE COMMIT puts the merge on top, so the match fails, it logs
      # "Expected 1 releases, only found 0" and exits green without tagging — which is how v1.1.0
      # ended up bumped but never released. This tags whatever the manifest says is unreleased.
      - name: Tag a release the action could not match
        id: recover
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 50 --no-tags "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" repo
          cd repo
          version=$(jq -r '.["."]' .github/.release-please-manifest.json)
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already tagged — nothing to do."
            exit 0
          fi

          # Tag the commit that set this version, not the merge on top of it.
          sha=$(git log -1 --format=%H --all --grep='^chore: release' -- .github/.release-please-manifest.json)
          if [ -z "$sha" ]; then
            echo "No release commit found for $tag; leaving it to the next run." >&2
            exit 0
          fi
          echo "Tagging $tag at ${sha:0:8}"

          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md)

          gh release create "$tag" --target "$sha" --title "$tag" --notes "${notes:-Release $tag}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  announce:
    name: Summarise release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Released ${{ needs.release-please.outputs.tag }}"
            echo ""
            echo "Version \`${{ needs.release-please.outputs.version }}\` is tagged and published."
            echo ""
            echo "[View release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag }})"
          } >> "$GITHUB_STEP_SUMMARY"
