name: Release

# Runs on every push to main. Release Please keeps ONE open release PR, updating
# it as commits land; merging that PR is what creates the tag. Nothing is pushed
# to main directly, so `enforce_admins` branch protection stays intact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PR opened with the default GITHUB_TOKEN does NOT trigger CI, so the
          # required checks would never report and the PR could never merge.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  announce:
    name: Summarise release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Released ${{ needs.release-please.outputs.tag }}"
            echo ""
            echo "Version \`${{ needs.release-please.outputs.version }}\` is tagged and published."
            echo ""
            echo "[View release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag }})"
          } >> "$GITHUB_STEP_SUMMARY"
