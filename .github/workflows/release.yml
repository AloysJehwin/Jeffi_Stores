name: Release

# Every push to main tags the next version and publishes a GitHub Release on its own, from the
# conventional commits since the last v* tag: a breaking change (`type!:` or a `BREAKING CHANGE:`
# footer) bumps major, `feat` minor, `fix`/`perf` patch; anything else releases nothing. No release
# PR and no commit to main, so branch protection stays intact. See docs/RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          LAST="$last" python3 -I - <<'PY'
          import os, re, subprocess
          last = os.environ["LAST"]
          log = subprocess.run(
              ["git", "log", f"{last}..HEAD" if last else "HEAD", "--no-merges", "--format=%h%x1f%s%x1f%b%x1e"],
              capture_output=True, text=True, check=True).stdout
          pat = re.compile(r"^(feat|fix|perf|refactor|revert|docs|test|ci|build|chore)(?:\(([^)]*)\))?(!)?: (.+)$")
          sections = {"feat": "Features", "fix": "Bug Fixes", "perf": "Performance", "refactor": "Refactoring", "revert": "Reverts"}
          notes, breaking, level = {k: [] for k in sections}, [], 0
          for entry in filter(None, (e.strip("\n") for e in log.split("\x1e"))):
              sha, subject, body = (entry.split("\x1f") + ["", ""])[:3]
              m = pat.match(subject.strip())
              if not m:
                  continue
              kind, scope, bang, desc = m.groups()
              line = f"- {f'**{scope}:** ' if scope else ''}{desc} ({sha})"
              if bang or re.search(r"^BREAKING[ -]CHANGE:", body, re.M):
                  level = 3
                  breaking.append(line)
              elif kind == "feat":
                  level = max(level, 2)
              elif kind in ("fix", "perf"):
                  level = max(level, 1)
              if kind in notes:
                  notes[kind].append(line)
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not level:
              print(f"Nothing to release since {last or 'the start'}.")
              out.write("version=\n")
              raise SystemExit
          major, minor, patch = (int(x) for x in (last.lstrip("v") if last else "0.0.0").split("."))
          major, minor, patch = (major + 1, 0, 0) if level == 3 else (major, minor + 1, 0) if level == 2 else (major, minor, patch + 1)
          version = f"{major}.{minor}.{patch}"
          md = [f"## v{version}", ""]
          if breaking:
              md += ["### Breaking changes", *breaking, ""]
          for kind, title in sections.items():
              if notes[kind]:
                  md += [f"### {title}", *notes[kind], ""]
          if last:
              md.append(f"**Full changes:** https://github.com/{os.environ['GITHUB_REPOSITORY']}/compare/{last}...v{version}")
          open("release-notes.md", "w").write("\n".join(md) + "\n")
          out.write(f"version={version}\n")
          print(f"{last or 'start'} -> v{version}")
          PY

      - name: Tag and publish
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          {
            echo "## Released $TAG"
            echo ""
            echo "[View release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
