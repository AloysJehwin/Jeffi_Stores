name: Stores

# Every store after the platform: their databases first (schema and migration files fanned out to
# each tenant), then their controller, messaging and document pods at the release images.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry-run:
        type: boolean
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  databases:
    name: Tenant databases
    runs-on: ubuntu-latest
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Schema and migration files to every store's database
        run: bash deploy/k8s/bootstrap/rollout.sh ${{ inputs.tag }} tenant-db ${{ inputs.dry-run && '--dry-run' || '' }}

  rollout:
    name: Roll out
    runs-on: ubuntu-latest
    needs: databases
    environment: production-release
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}
      - name: Every store's controller, messaging and document pods at ${{ inputs.tag }}
        run: bash deploy/k8s/bootstrap/rollout.sh ${{ inputs.tag }} stores ${{ inputs.dry-run && '--dry-run' || '' }}
