name: Node setup
description: Node 20 with the npm cache, root npm ci, and an optional extra install.
inputs:
  install:
    description: Extra install command after the root npm ci
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          package-lock.json
          ai-platform/package-lock.json
    - shell: bash
      run: npm ci
      env:
        # onnxruntime-node's install downloads extra CUDA binaries from Microsoft; CI runs on the bundled
        # CPU build, and that download times out often enough to fail jobs.
        ONNXRUNTIME_NODE_INSTALL: skip
    - if: inputs.install != ''
      shell: bash
      run: ${{ inputs.install }}
