<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..900,0..100&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet" />
<style>
  :root {
    --ink: #2a2822; --ink2: rgba(42, 40, 34, .72); --accent: #c46a46; --accent-deep: #a9552f; --sage: #dfe9cf; --sage-deep: #6b7f55;
    --sand: #ecdfc8; --peach: #fbe3d4; --apricot: #f9c6a3; --frame: #f8f3ea; --chrome: #f3ead9; --band: #2a2822; --band-text: #f3ead9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f3ea; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(135deg, #f8f3ea 0%, #f4e8d6 55%, #fbe3d4 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
  .scene { position: absolute; inset: 0; display: none; will-change: opacity, transform; }
  .display { font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 50, 'opsz' 144; font-weight: 800; letter-spacing: -0.02em; }
  .kicker { font-weight: 700; font-size: 20px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .word { display: inline-block; will-change: transform, opacity; }
  /* window */
  .win { position: absolute; border-radius: 26px; overflow: hidden; background: var(--chrome); box-shadow: 0 50px 120px -30px rgba(42, 30, 15, .42), 0 0 0 1px rgba(42, 40, 34, .08); will-change: transform, opacity; }
  .bar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 22px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .url { margin-left: 14px; flex: 0 1 520px; height: 32px; border-radius: 16px; background: #fffaf1; display: flex; align-items: center; padding: 0 16px; font: 500 15px Inter; color: var(--ink2); white-space: nowrap; overflow: hidden; }
  .view { position: relative; overflow: hidden; background: #fff; border-radius: 20px 20px 0 0; }
  .view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  /* phone */
  .phone { position: absolute; border-radius: 64px; background: #141414; padding: 14px; box-shadow: 0 50px 120px -30px rgba(42, 30, 15, .5); will-change: transform, opacity; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #fff; }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .notch { position: absolute; top: 14px; left: 50%; width: 120px; height: 32px; margin-left: -60px; border-radius: 0 0 18px 18px; background: #141414; z-index: 2; }
  /* lower third */
  .lower { position: absolute; left: 88px; bottom: 80px; max-width: 760px; padding: 26px 32px 28px; border-radius: 28px; background: rgba(255, 252, 246, .86); backdrop-filter: blur(18px); box-shadow: 0 24px 60px -20px rgba(42, 30, 15, .35), 0 0 0 1px rgba(42, 40, 34, .06); will-change: transform, opacity; }
  .lower h3 { font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 50, 'opsz' 72; font-weight: 800; font-size: 44px; line-height: 1.05; margin-top: 8px; letter-spacing: -0.01em; }
  .lower p { margin-top: 10px; font-size: 24px; line-height: 1.35; color: var(--ink2); }
  .brand { position: absolute; left: 64px; top: 40px; display: flex; align-items: center; gap: 12px; font: 700 20px Inter; color: var(--ink); opacity: .9; }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-family: Fraunces, serif; font-weight: 900; font-size: 22px; }
  .side { position: absolute; will-change: transform, opacity; }
  .side h2 { font-size: 78px; line-height: 1.02; margin-top: 18px; }
  .side ul { list-style: none; margin-top: 34px; display: grid; gap: 18px; }
  .side li { font-size: 28px; line-height: 1.3; color: var(--ink2); display: flex; gap: 14px; align-items: flex-start; }
  .side li::before { content: ''; flex: none; width: 12px; height: 12px; margin-top: 12px; border-radius: 50%; background: var(--accent); }
  .tile { position: absolute; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 40px -16px rgba(42, 30, 15, .4), 0 0 0 1px rgba(42, 40, 34, .06); background: #fff; will-change: transform, opacity; }
  .tile img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .tile span { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(20, 18, 14, .72); color: #fff; font: 600 13px Inter; }
  .pill { display: inline-flex; align-items: center; gap: 12px; padding: 16px 30px; border-radius: 999px; font: 700 28px Inter; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="stage.js"></script>
</body>
</html>
