services:
  app_green:
    image: ghcr.io/aloysjehwin/jeffi_stores:latest
    container_name: jeffi-app-green
    env_file: .env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - WEB_CONCURRENCY=2
    volumes:
      - ./certs:/app/certs:ro
      - ./jeffi-stores-76e9ecaecdd6.json:/app/jeffi-stores-76e9ecaecdd6.json:ro
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  internal:
    name: jeffi_internal
    external: true
