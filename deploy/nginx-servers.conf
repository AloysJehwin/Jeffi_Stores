# ── SaaS control plane: ecom.jeffistores.in ──────────────────────────────────
# Explicit server_name beats the tenant regex below so ecom. is never treated as a tenant.
server {
    listen 80;
    server_name ecom.jeffistores.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ecom.jeffistores.in;

    ssl_certificate /etc/letsencrypt/live/jeffistores.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeffistores.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 20M;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }
    location /_next/static {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ── Multi-tenant subdomains (SaaS) ───────────────────────────────────────────
# Catch-all regex server_names for provisioned tenants: {slug}.jeffistores.in and
# admin-{slug}.jeffistores.in. LOWER priority than every exact server_name above, so the
# flagship + admin./business./forms. etc. always win; only unmatched tenant hosts fall
# through here. Requires the wildcard *.jeffistores.in TLS cert. All proxy to app_backend
# with Host $host so the app middleware resolves the tenant from the Host header and routes
# queries to that tenant's own RDS.
#
# NOTE: this is what makes a freshly-provisioned tenant actually SERVE. It was previously
# applied only on the box (not the repo), so a repo-rebuilt EC2 would 404 every tenant host.

server {
    listen 80;
    server_name ~^admin-(?<tslug>[a-z0-9-]+)\.jeffistores\.in$;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ~^admin-(?<tslug>[a-z0-9-]+)\.jeffistores\.in$;

    ssl_certificate /etc/letsencrypt/live/jeffistores.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeffistores.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 20M;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }
    location /_next/static {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

