# Hand-authored manifests (NOT regenerated by gen-cronjobs.ts).
# Nightly logical backup of every Basic-shape tenant Postgres pod: pg_dump|gzip to
# s3://<TENANT_BACKUP_BUCKET>/tenants/<slug>/db/YYYY-MM-DD.sql.gz, keep 14 days.
# Discovers tenants by listing namespaces labelled jeffi.io/tenant=<slug> that contain a
# Deployment named <slug>-postgres (basic shape); skips tenants whose db is on RDS.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenant-db-backup
  namespace: jeffi
  labels: { app.kubernetes.io/part-of: jeffi-cron }
spec:
  schedule: '27 2 * * *' # 02:27 IST — off peak + off the :00/:30 marks
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800 # 3h for all tenants in series
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/part-of: jeffi-cron }
        spec:
          restartPolicy: Never
          serviceAccountName: tenant-db-backup
          nodeSelector: { jeffi.io/role: core }
          imagePullSecrets: [{ name: regcred }]
          containers:
            - name: dump
              image: 708835965056.dkr.ecr.us-east-1.amazonaws.com/jeffi-stores-controller-service:latest
              env:
                - name: BUCKET
                  valueFrom: { secretKeyRef: { name: tenant-db-backup, key: BUCKET } }
                - name: KEEP_DAYS
                  value: '14'
              command:
                - sh
                - -c
                - |
                  set -eu
                  TODAY=$(date -u +%F)
                  CUTOFF=$(date -u -d "-${KEEP_DAYS} days" +%s 2>/dev/null || python3 -c "import time,os;print(int(time.time()-int(os.environ['KEEP_DAYS'])*86400))")
                  # Every namespace whose name starts with tenant- (the pattern tenantNamespace() emits).
                  for NS in $(kubectl get ns -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep '^tenant-'); do
                    SLUG=${NS#tenant-}
                    # Skip tenants whose db is on RDS (no postgres deployment in the namespace).
                    kubectl -n "$NS" get deploy "${SLUG}-postgres" >/dev/null 2>&1 || continue
                    POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
                    [ -n "$POD" ] || { echo "skip $SLUG: no pod"; continue; }
                    KEY="tenants/${SLUG}/db/${TODAY}.sql.gz"
                    echo "dump $SLUG -> s3://${BUCKET}/${KEY}"
                    kubectl -n "$NS" exec -i "$POD" -- sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -U "$POSTGRES_USER" -d jeffi_stores -Fc' | gzip -c | aws s3 cp - "s3://${BUCKET}/${KEY}" --expected-size 0
                    # Retention: delete anything older than KEEP_DAYS under tenants/<slug>/db/.
                    aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "tenants/${SLUG}/db/" --query "Contents[?to_string(LastModified)!=null].{K:Key,T:LastModified}" --output text 2>/dev/null | while read K T; do
                      TS=$(date -u -d "$T" +%s 2>/dev/null || echo 0)
                      [ "$TS" -gt 0 ] && [ "$TS" -lt "$CUTOFF" ] && aws s3 rm "s3://${BUCKET}/${K}" || true
                    done
                  done
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
---
# Minimal RBAC: list namespaces + list/exec postgres pods and get their deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-db-backup
  namespace: jeffi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-db-backup
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-db-backup
subjects:
  - kind: ServiceAccount
    name: tenant-db-backup
    namespace: jeffi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-db-backup
