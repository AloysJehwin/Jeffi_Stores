# mTLS: admin. and k8s. require a cert from the platform CA; admin-{slug} requests one from any
# tenant CA in client-ca-bundle and the app verifies the chain per tenant (tenant-mtls.ts).
# Secrets platform-ca (ca.crt) and client-ca-bundle (ca.crt) are created by bootstrap/secrets.sh
# and client-ca-bundle is patched by the app (mtls-fleet) when a tenant CA is issued.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata: { name: default, namespace: jeffi-edge }
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata: { name: platform-mtls, namespace: jeffi-edge }
spec:
  minVersion: VersionTLS12
  clientAuth:
    secretNames: [platform-ca]
    clientAuthType: RequireAndVerifyClientCert
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata: { name: tenant-mtls, namespace: jeffi-edge }
spec:
  minVersion: VersionTLS12
  clientAuth:
    secretNames: [client-ca-bundle]
    clientAuthType: RequestClientCert
---
# Blank any client-supplied cert headers first so only Traefik's own values reach the app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: strip-client-cert, namespace: jeffi-edge }
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Tls-Client-Cert: ''
      X-Forwarded-Tls-Client-Cert-Info: ''
      X-Client-Cert: ''
      X-Client-Cert-Serial: ''
      X-Client-Cert-Cn: ''
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: pass-client-cert, namespace: jeffi-edge }
spec:
  passTLSClientCert:
    pem: true
    info:
      serialNumber: true
      subject: { commonName: true }
      issuer: { commonName: true }
---
# The admin, business and controller apps load their build output under /_<app> (next.config assetPrefix);
# the app itself expects /_next. Routes generated from service-routing.ts attach this on those paths.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: strip-asset-prefix, namespace: jeffi-edge }
spec:
  stripPrefix:
    prefixes: [/_controller, /_admin, /_business]
---
# gzip/brotli for text responses (API JSON is ~6x smaller); media is already compressed and SSE must stream.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: compress, namespace: jeffi-edge }
spec:
  compress:
    minResponseBodyBytes: 1024
    excludedContentTypes:
      - text/event-stream
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
      - image/avif
      - video/mp4
      - video/webm
      - application/pdf
      - application/zip
      - application/octet-stream
      - font/woff2
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: https-redirect, namespace: jeffi-edge }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
# Any other host on :80 → https (CloudFront's apex/www HTTP origin route has higher priority).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: http-to-https, namespace: jeffi-edge }
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`.+`)
      priority: 1
      kind: Rule
      middlewares: [{ name: https-redirect }]
      services: [{ name: noop@internal, kind: TraefikService }]
