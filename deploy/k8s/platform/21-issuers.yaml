apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: letsencrypt-dns }
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aloysjehwin@gmail.com
    privateKeySecretRef: { name: letsencrypt-dns-account }
    solvers:
      - dns01:
          route53: { region: us-east-1, hostedZoneID: Z08094881XKVZ9XSGBKG1 }
---
# Tenant custom domains (customer-owned zones) use HTTP-01 through Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: letsencrypt-http }
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aloysjehwin@gmail.com
    privateKeySecretRef: { name: letsencrypt-http-account }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: wildcard-jeffistores, namespace: jeffi-edge }
spec:
  secretName: wildcard-jeffistores-tls
  issuerRef: { kind: ClusterIssuer, name: letsencrypt-dns }
  dnsNames: [jeffistores.in, '*.jeffistores.in', '*.business.jeffistores.in']
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata: { name: default, namespace: jeffi-edge }
spec:
  defaultCertificate: { secretName: wildcard-jeffistores-tls }
