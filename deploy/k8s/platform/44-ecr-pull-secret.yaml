# ECR login tokens last 12h: refresh the `regcred` pull secret in jeffi and every tenant namespace
# every 6h. Uses the node instance profile (needs ecr:GetAuthorizationToken + pull on jeffi-stores).
apiVersion: v1
kind: ServiceAccount
metadata: { name: ecr-refresh, namespace: jeffi }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: ecr-refresh }
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [list]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: ecr-refresh }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ecr-refresh }
subjects: [{ kind: ServiceAccount, name: ecr-refresh, namespace: jeffi }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: ecr-refresh, namespace: jeffi }
spec:
  schedule: '17 */6 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ecr-refresh
          restartPolicy: OnFailure
          nodeSelector: { jeffi.io/role: core }
          volumes: [{ name: token, emptyDir: { medium: Memory } }]
          initContainers:
            - name: login
              image: public.ecr.aws/aws-cli/aws-cli:2.22.35
              command: [sh, -c, 'aws ecr get-login-password --region us-east-1 > /token/password']
              volumeMounts: [{ name: token, mountPath: /token }]
          containers:
            - name: apply
              image: registry.k8s.io/kubectl:v1.34.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  for ns in jeffi $(kubectl get ns -l jeffi.io/tier=tenant -o jsonpath='{.items[*].metadata.name}'); do
                    kubectl -n "$ns" create secret docker-registry regcred \
                      --docker-server=708835965056.dkr.ecr.us-east-1.amazonaws.com --docker-username=AWS \
                      --docker-password="$(cat /token/password)" --dry-run=client -o yaml | kubectl apply -f -
                  done
              volumeMounts: [{ name: token, mountPath: /token }]
