# PaddleOCR sidecar (ai-platform/paddleocr): POST /ocr {data, mime_type}, behind the gateway's /v1/ocr and
# /v1/vision. One replica: it runs one inference at a time anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddleocr
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: paddleocr }
  template:
    metadata:
      labels: { app: paddleocr }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: paddleocr
          image: jeffi/paddleocr:latest
          ports:
            - containerPort: 8866
          env:
            # Inference threads: keep equal to the CPU limit, or the extra threads only get throttled.
            - { name: OCR_CPU_THREADS, value: "2" }
          # Ready once the model is in memory (?ready=1); alive while the process answers. A model that failed to
          # load fails both, so the pod restarts.
          readinessProbe:
            httpGet: { path: "/health?ready=1", port: 8866 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8866 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: paddleocr
  namespace: ai-platform
spec:
  selector: { app: paddleocr }
  ports:
    - port: 8866
      targetPort: 8866
