apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  namespace: ai-platform
data:
  PORT: "8080"
  # Comma-separated, tried in order; first healthy wins (GET /readyz shows which).
  OLLAMA_BASE_URLS: "http://ollama:11434"
  OLLAMA_PROBE_INTERVAL_MS: "15000"
  PADDLE_OCR_URL: "http://paddleocr:8866"
  REDIS_URL: "redis://ai-redis:6379"
  OLLAMA_REQUEST_TIMEOUT_MS: "120000"
  OLLAMA_AGENT_MODEL: "qwen2.5:7b"
  OLLAMA_SQL_MODEL: "gemma4:12b"
  OLLAMA_COPY_MODEL: "gemma4:12b"
  OLLAMA_EMAIL_MODEL: "gemma3:4b"
  OLLAMA_FAST_MODEL: "gemma3:4b"
  OLLAMA_VISION_MODEL: "gemma4:12b"
  RAG_EMBED_MODEL: "nomic-embed-text"
  AI_JOB_ATTEMPTS: "3"
  AI_WORKER_CONCURRENCY: "2"
  # Images and video (see README "Images and video").
  AI_IMAGE_PROVIDERS: "razer,google,replicate"
  AI_VIDEO_PROVIDERS: "google,replicate"
  AI_PUBLIC_URL: ""
  AI_IMAGE_CACHE_TTL_SECONDS: "3600"
  AI_FILES_TTL_SECONDS: "3600"
  AI_VIDEO_TTL_SECONDS: "86400"
  AI_VIDEO_POLL_MS: "10000"
  AI_USD_INR: "84"
  AI_PRICES_JSON: ""
  SD_WEBUI_URL: ""
  SD_MODEL: ""
  SD_STEPS: "25"
  SD_CFG: "7"
  SD_SAMPLER: "DPM++ 2M Karras"
  SD_TIMEOUT_MS: "180000"
  GOOGLE_IMAGE_MODEL: "gemini-3.1-flash-image"
  GOOGLE_IMAGE_PREMIUM_MODEL: "gemini-3-pro-image"
  GOOGLE_IMAGEN_MODEL: ""
  GOOGLE_VEO_MODEL: "veo-3.1-fast-generate-preview"
  GOOGLE_VEO_FALLBACK: "veo-3.0-generate-001"
  GOOGLE_TIMEOUT_MS: "120000"
  REPLICATE_TIMEOUT_MS: "180000"
  # Claude text. Text order; empty = anthropic,razer when Claude auth is configured.
  AI_TEXT_PROVIDERS: ""
  # Workload identity federation: org-wide id + the projected token (gateway.yaml). Per-store
  # workspace/service-account/rule ids come with each request from ai_provider_identities.
  ANTHROPIC_ORGANIZATION_ID: ""
  ANTHROPIC_IDENTITY_TOKEN_FILE: "/var/run/secrets/anthropic/token"
  # Must equal the projected token audience in gateway.yaml.
  ANTHROPIC_FEDERATION_AUDIENCE: "https://api.anthropic.com"
  ANTHROPIC_AGENT_MODEL: "claude-sonnet-5-5"
  ANTHROPIC_AGENT_EFFORT: "medium"
  ANTHROPIC_FAST_MODEL: "claude-haiku-5-5"
  ANTHROPIC_COPY_MODEL: "claude-haiku-5-5"
  ANTHROPIC_DEEP_MODEL: "claude-opus-5-5"
  ANTHROPIC_VISION_MODEL: "claude-sonnet-5-5"
  ANTHROPIC_FALLBACKS: "default"
  ANTHROPIC_TIMEOUT_MS: "120000"
  ANTHROPIC_MIN_MAX_TOKENS: "8000"
---
# secret.example.yaml — copy to a real Secret (never commit real values).
# AI_CACHE_PG_URL: postgres connection for the ai_cache (pgvector) table.
# OPENAI_API_KEY: only used when a request forces the openai provider.
# GOOGLE_AI_API_KEY: Gemini API key (images, Veo video). Empty = google skipped.
# REPLICATE_API_TOKEN: Replicate token (Flux, Wan video). Empty = replicate skipped.
# ANTHROPIC_API_KEY: local dev only (production uses workload identity). Leave empty in clusters.
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secret
  namespace: ai-platform
type: Opaque
stringData:
  AI_CACHE_PG_URL: ""
  OPENAI_API_KEY: ""
  GOOGLE_AI_API_KEY: ""
  REPLICATE_API_TOKEN: ""
  ANTHROPIC_API_KEY: ""
