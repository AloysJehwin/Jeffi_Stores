# Razer (k3s, single GPU box) overlay: the LLM service only (Ollama, PaddleOCR, the GPU device plugin; the image
# server and the GPU guards live in host/). The AI gateway and its Redis run in the main cluster
# (deploy/k8s/platform/48-ai-gateway-service.yaml) and reach this box over Tailscale. Deploy with:
#   kubectl apply -k deploy/overlays/razer
# k3s runs with --disable traefik (the host nginx owns :80) and --default-runtime nvidia.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - paddleocr-lb.yaml
patches:
  # Ollama replaces the host's systemd service: same user, same model store, same 0.0.0.0:11434,
  # so callers that still hit the host port directly keep working.
  - target: { kind: Deployment, name: ollama }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirstWithHostNet
      - op: add
        path: /spec/template/spec/securityContext
        value: { runAsUser: 999, runAsGroup: 999, supplementalGroups: [44, 110] }
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ollama/ollama:0.30.8
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: HOME, value: /home/ollama }
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts/0/mountPath
        value: /home/ollama/.ollama
      - op: replace
        path: /spec/template/spec/volumes/0
        value: { name: models, hostPath: { path: /usr/share/ollama/.ollama, type: Directory } }
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: ollama-models, namespace: ai-platform }
      $patch: delete
  # PaddleOCR (paddleocr/Dockerfile) is built on the box (host/ai-gateway-release.sh). CPU only, next to the GPU
  # work: 4 cores with as many inference threads; ~1.5 GiB resident with the models loaded. Reached from the main
  # cluster through paddleocr-lb (:8866 on the tailnet address).
  - target: { kind: Deployment, name: paddleocr }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 500m, memory: 1536Mi }, limits: { cpu: "4", memory: 4Gi } }
  # The gateway and its Redis moved to the main cluster; drop their base objects here. A delete patch removes
  # nothing already running: `ai-gateway-release retire-gateway` on the box does, once the platform gateway serves.
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: ai-gateway, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ai-gateway, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: Service
      metadata: { name: ai-gateway, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: ai-gateway, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: ai-gateway-config, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: Secret
      metadata: { name: ai-gateway-secret, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: ai-redis, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: Service
      metadata: { name: ai-redis, namespace: ai-platform }
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: ai-redis-data, namespace: ai-platform }
      $patch: delete
